<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Легенда острова</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Ruslan+Display&display=swap">
<style>
:root{
  --bg:#eef3ef; --surface:#ffffff; --text:#14262c; --muted:#4d646b;
  --sea:#1f6f78; --sun:#a8700a; --coral:#c24a44; --vio:#8a5a9c; --line:#c9d8d4;
  --hero-a:#0f2a33; --hero-b:#1f6f78; --hero-text:#f3efe2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1d22; --surface:#12292f; --text:#e9efe9; --muted:#9db5b8;
    --sea:#59b3bb; --sun:#f2b84b; --coral:#ef7f77; --vio:#c79ad8; --line:#25444b;
    --hero-a:#07151a; --hero-b:#14515a;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1d22; --surface:#12292f; --text:#e9efe9; --muted:#9db5b8;
  --sea:#59b3bb; --sun:#f2b84b; --coral:#ef7f77; --vio:#c79ad8; --line:#25444b;
  --hero-a:#07151a; --hero-b:#14515a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Alegreya",Georgia,"Times New Roman",serif;font-size:1.25rem;line-height:1.7}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hero{background:linear-gradient(170deg,var(--hero-a),var(--hero-b));color:var(--hero-text);padding:3rem 1.5rem 0;text-align:center;overflow:hidden}
.lang{display:inline-flex;gap:.3rem;margin-bottom:1.5rem;background:rgba(255,255,255,.12);padding:.25rem;border-radius:999px}
.lang button{font:inherit;font-size:1rem;border:0;background:transparent;color:var(--hero-text);padding:.3rem 1rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#f2b84b;color:#1b1500}
.hero h1{font-family:"Ruslan Display","Alegreya",Georgia,serif;font-weight:400;font-size:clamp(2.8rem,10vw,6rem);line-height:1.05;margin:0 auto;max-width:12ch}
.hero .lead{max-width:34rem;margin:1.2rem auto 0;font-size:1.2rem;opacity:.9}
.hero .btn{display:inline-block;margin-top:1.6rem;padding:.7rem 1.5rem;border-radius:999px;background:#f2b84b;color:#1b1500;text-decoration:none;font-weight:500}
.hero svg{display:block;width:100%;height:90px;margin-top:2rem}
main{max-width:42rem;margin:0 auto;padding:3rem 1.5rem 2rem}
article{margin-bottom:3.5rem}
.chapter-head{border-left:4px solid var(--sun);padding-left:1rem;margin-bottom:2rem}
.chapter-head small{color:var(--muted);font-size:1rem}
.chapter-head h2{margin:.1rem 0 0;font-family:"Ruslan Display","Alegreya",Georgia,serif;font-weight:400;font-size:2.2rem;line-height:1.2}
.story p{margin:0 0 1.2rem}
.story .first::first-letter{font-family:"Ruslan Display","Alegreya",serif;float:left;font-size:4rem;line-height:.85;padding:.35rem .6rem 0 0;color:var(--sea)}
.story .line{margin:0 0 .9rem;padding-left:1rem;border-left:3px solid var(--c,var(--line))}
.line b{color:var(--c,var(--text));font-weight:500}
.sp-n{--c:var(--coral)} .sp-i{--c:var(--sun)} .sp-a{--c:var(--sea)} .sp-l{--c:var(--vio)} .sp-g{--c:var(--muted)} .sp-y{--c:#d08a3c}
h3{font-size:1.5rem;margin:3rem 0 1rem}
.cast{list-style:none;padding:0;margin:0;display:grid;gap:.9rem}
.cast li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;display:grid;grid-template-columns:3.2rem 1fr;gap:.2rem 1rem;align-items:center}
.cast .mark{grid-row:span 2;width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:500;color:#fff}
.cast b{font-size:1.3rem}
.cast span{color:var(--muted);line-height:1.4}
.m-n{background:#c24a44}.m-i{background:#7a6a2a}.m-a{background:#1f6f78}.m-l{background:#8a5a9c}.m-g{background:#5d6d72}.m-y{background:#a0612a}
.next{margin-top:3rem;border:2px dashed var(--line);border-radius:14px;padding:1.4rem;text-align:center;color:var(--muted)}
.next h3{margin:0 0 .4rem;color:var(--text)}
footer{text-align:center;color:var(--muted);padding:2rem 1.5rem 3rem;font-size:1rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.stage{max-width:34rem;margin:0 auto;padding:2rem 1rem 3rem;scroll-margin-top:1rem}
.book{perspective:1400px}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;width:100%;aspect-ratio:3/4;max-height:34rem;border:0;border-radius:6px 16px 16px 6px;cursor:pointer;color:#f2d98b;font:inherit;text-align:center;padding:2rem;background:linear-gradient(135deg,#14515a,#0c2a31);box-shadow:inset 10px 0 0 rgba(0,0,0,.35),inset 0 0 0 10px #0c2a31,inset 0 0 0 12px #c9a24a,0 18px 40px rgba(0,0,0,.35);transform-origin:left center;transition:transform .7s ease,opacity .7s ease}
.cover[hidden],.sheet[hidden]{display:none}
.cover.opening{transform:rotateY(-110deg);opacity:.2}
.cv-t{font-family:"Ruslan Display","Alegreya",Georgia,serif;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1.1}
.cv-i{font-size:3.5rem;transition:transform .3s}
.cover:hover .cv-i{transform:scale(1.12)}
.cv-s{font-size:1rem;opacity:.85;font-style:italic}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px 16px 16px 6px;padding:2rem 1.6rem 1.6rem 2.2rem;min-height:26rem;font-size:1.15rem;box-shadow:inset 8px 0 14px -8px rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.18);transition:opacity .25s,transform .25s;outline:none}
.paper.turn{opacity:0;transform:translateX(14px) rotateY(-8deg)}
.paper .chapter-head h2{font-size:1.8rem}
.paper h3{margin-top:0}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:1rem}
.ctrl span{color:var(--muted);font-size:1rem}
.ctrl button,.closeb{font:inherit;font-size:1rem;padding:.55rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.ctrl button:disabled{opacity:.4;cursor:default}
.closeb{display:block;margin:1rem auto 0;color:var(--muted)}
.resb{display:block;width:100%;margin:0 0 .8rem;padding:.8rem 1.2rem;font:inherit;font-size:1.05rem;font-weight:700;border-radius:999px;border:1px solid #c9a24a;background:#14515a;color:#f2d98b;cursor:pointer}
.resb:hover,.resb:focus-visible{background:#1c6a75}
.resb[hidden],.retb[hidden]{display:none}
.retb{display:block;margin:.8rem auto 0;padding:.6rem 1.2rem;font:inherit;font-size:1rem;font-weight:700;border-radius:999px;border:1px solid #c9a24a;background:#14515a;color:#f2d98b;cursor:pointer}
.retb:hover,.retb:focus-visible{background:#1c6a75}
.chest{display:block;margin:1.2rem auto 0;width:5rem;height:4rem;padding:0;border:0;background:transparent;cursor:pointer;transition:transform .2s;animation:chsw 3.5s ease-in-out infinite}
.chest:hover,.chest:focus-visible{transform:scale(1.1) rotate(-3deg);animation:none}
.chest svg{width:100%;height:100%;display:block}
@keyframes chsw{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-4deg)}96%{transform:rotate(4deg)}}
.chm{position:fixed;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(3,6,5,.98);overflow:auto}
.chm[hidden]{display:none}
.chm-w{width:min(24rem,100%);text-align:center;color:#eee6d2}
.chm-w h2{margin:.2rem 0 .4rem;font-size:1.4rem}
.chm-w p{margin:.4rem 0;line-height:1.5}
.chm-c{width:min(11rem,50vw);margin:2.6rem auto .6rem}
.chm-c svg{display:block;width:100%;height:auto;overflow:visible}
.chm-c .lid{transform-origin:10px 40px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.chm-c.open .lid{transform:rotate(-62deg)}
.chm-c.shake{animation:chshk .5s}
@keyframes chshk{20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.chm-r{min-height:7.5rem}
.chm-big{font-size:2.6rem;line-height:1;margin:.2rem 0}
.chm-t{font-size:1.7rem;font-weight:700;color:#ffe9a8;margin:.2rem 0}
.chm-s{font-size:.9rem;opacity:.75;margin-top:.6rem}
.chm-b{display:inline-block;margin:.5rem .3rem 0;padding:.65rem 1.4rem;font:inherit;font-weight:700;border-radius:999px;border:1px solid #c9a24a;background:#14515a;color:#f2d98b;cursor:pointer}
.chm-b.sec{background:transparent;color:#eee6d2;border-color:#eee6d2;font-weight:400}
.chm.legend::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 38%,rgba(255,226,120,.95),rgba(255,170,30,.45) 35%,transparent 70%);animation:tkflash 1.2s ease-out forwards;z-index:0}
@keyframes tkflash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.chm-w{position:relative;z-index:1}
.chm-c.glow{filter:drop-shadow(0 0 14px rgba(255,200,60,.9))}
.tk{position:relative;height:9.5rem;margin:-.5rem 0 .2rem;overflow:visible}
.tk-beam{position:absolute;left:50%;bottom:0;width:6rem;height:130%;margin-left:-3rem;transform-origin:50% 100%;background:linear-gradient(to top,rgba(255,215,90,.95),rgba(255,190,40,.45) 55%,rgba(255,190,40,0));clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);animation:tkbeam 1.1s ease-out both}
@keyframes tkbeam{0%{transform:scaleY(0);opacity:0}25%{opacity:1}100%{transform:scaleY(1);opacity:.55}}
.tk-ring{position:absolute;left:50%;top:50%;width:4rem;height:4rem;margin:-2rem 0 0 -2rem;border:3px solid #ffe28a;border-radius:50%;opacity:0;animation:tkring .9s .35s ease-out}
@keyframes tkring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.tk-coin{position:absolute;left:50%;top:50%;width:4.4rem;height:4.4rem;margin:-2.2rem 0 0 -2.2rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd24a 40%,#c98a10 80%,#7a4d05);border:3px solid #ffe28a;box-shadow:0 0 22px 6px rgba(255,200,60,.8);display:flex;align-items:center;justify-content:center;animation:tkpop 1.1s cubic-bezier(.2,1.2,.4,1) both,tkspin 2.4s 1.1s linear infinite}
.tk-coin b{font-size:2rem;line-height:1;color:#5a3703;font-weight:400}
@keyframes tkpop{0%{transform:translateY(90px) scale(.2) rotateY(0)}70%{transform:translateY(-14px) scale(1.15) rotateY(1000deg)}100%{transform:translateY(0) scale(1) rotateY(1080deg)}}
@keyframes tkspin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.tk-sp i{position:absolute;left:50%;top:50%;width:.55rem;height:.55rem;margin:-.28rem 0 0 -.28rem;background:#fff3b0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;animation:tksp 1s ease-out forwards}
@keyframes tksp{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.4) rotate(120deg)}}
.tk-rar{font-weight:700;letter-spacing:.35em;font-size:.95rem;margin:.1rem 0 0;color:transparent;background:linear-gradient(100deg,#b8730a 20%,#fff2a8 45%,#ffd24a 55%,#b8730a 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:tkshine 2.2s linear infinite}
@keyframes tkshine{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.chm.legend::before{animation:none;opacity:0}.tk-beam,.tk-ring,.tk-coin,.tk-sp i,.tk-rar{animation:none}.tk-beam{opacity:.55}.tk-sp{display:none}.tk-rar{color:#ffd24a;background:none}}
.mp{position:fixed;left:.8rem;bottom:.8rem;z-index:45;display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem .35rem .4rem;border-radius:999px;background:rgba(10,20,16,.9);border:1px solid #c9a24a;color:#f2d98b;font-size:.95rem}
.mp[hidden]{display:none}
.mp button{width:2rem;height:2rem;border-radius:50%;border:0;background:#14515a;color:#f2d98b;font-size:1rem;cursor:pointer}
.mp input{width:4.5rem;accent-color:#c9a24a}
@media (prefers-reduced-motion:reduce){.chest{animation:none}.chm-c .lid{transition:none}.chm-c.shake{animation:none}}

.ck{position:absolute;bottom:0;width:2.2rem;height:1.25rem;border:0;padding:0;background:transparent;cursor:pointer;opacity:.7;z-index:2}
.ck svg{display:block;width:100%;height:100%}
.ck:hover,.ck:focus-visible{opacity:1;filter:drop-shadow(0 0 4px rgba(242,217,139,.8))}
.ckm{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem;background:#0b0f0d;overflow:auto}
.ckm[hidden]{display:none}
.ck-w{width:min(26rem,100%);text-align:center;color:#eee6d2}
.ck-w svg{width:auto;max-width:70vw;height:min(36vh,15rem);display:block;margin:0 auto 1rem}
.ck-w h2{margin:.2rem 0 1rem;font-size:1.9rem;line-height:1.2}
.ck-b{display:inline-block;padding:.7rem 1.6rem;font:inherit;font-weight:700;border-radius:999px;border:1px solid #c9a24a;background:#14515a;color:#f2d98b;cursor:pointer}
@keyframes ckfl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ck-w svg .fl{transform-origin:50% 100%;animation:ckfl 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ck-w svg .fl{animation:none}}

.pt{position:absolute;bottom:.5rem;width:1.6rem;height:2rem;border:0;padding:0;background:transparent;cursor:pointer;transform-origin:50% 0;animation:ptsw 5s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));z-index:2}
.pt svg{display:block;width:100%;height:100%}
.pt:hover,.pt:focus-visible{transform:scale(1.2);animation:none}
@keyframes ptsw{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.pgm{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(3,6,5,.92)}
.pgm[hidden]{display:none}
.pg-w{width:min(24rem,100%);max-height:96vh;overflow:auto;color:#eee6d2;text-align:center}
.pg-w h2{margin:.2rem 0 .5rem;font-size:1.4rem}
.pg-w p{margin:.4rem 0;line-height:1.5}
.pg-a{position:relative;width:100%;height:min(54vh,26rem);margin:.6rem 0;border:1px solid #c9a24a;border-radius:12px;overflow:hidden;background:linear-gradient(#10261b,#06100b);touch-action:manipulation}
.pg-boss{position:absolute;left:50%;top:.2rem;width:5.2rem;height:5.2rem;margin-left:-2.6rem;animation:pgb 1.6s ease-in-out infinite}
@keyframes pgb{0%,100%{transform:translateX(-14px) rotate(-6deg)}50%{transform:translateX(14px) rotate(6deg)}}
.pg-f{position:absolute;top:0;will-change:transform;width:2.9rem;height:2.9rem;margin-left:-1.45rem;border:0;padding:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 40% 35%,#fff7b0 0 18%,#ffb02e 45%,#e8431a 75%,#8a1d0a);box-shadow:0 0 14px 4px rgba(255,120,30,.7)}
.pg-f.hit{pointer-events:none;background:radial-gradient(circle,#fff 0 25%,#7fe3ff 60%,transparent 70%);box-shadow:0 0 18px 8px rgba(127,227,255,.8);opacity:0;transition:transform .25s,opacity .25s}
.pg-f.miss{pointer-events:none;opacity:0;transition:opacity .25s}
.pg-hp{letter-spacing:.2rem;font-size:1.2rem;color:#ff5a6e}
.pg-h.off{color:#4a3a3d}
.pg-a.shake{animation:pgsh .3s}
@keyframes pgsh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pg-bar{display:flex;justify-content:space-between;gap:.6rem;font-size:.95rem}
.pg-b{display:inline-block;margin:.5rem .3rem 0;padding:.65rem 1.5rem;font:inherit;font-weight:700;border-radius:999px;border:1px solid #c9a24a;background:#14515a;color:#f2d98b;cursor:pointer}
.pg-b.sec{background:transparent;color:#eee6d2;border-color:#eee6d2;font-weight:400}
.pg-win{font-size:2rem;font-weight:700;color:#ffe9a8;margin:1rem 0 .4rem}
@media (prefers-reduced-motion:reduce){.pt{animation:none}.pg-boss{animation:none}}


@media (prefers-reduced-motion:reduce){.cover,.paper{transition:none}}

:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{
 color-scheme:dark;--bg:#0a100c;--surface:#121b15;--text:#e9e3d6;--muted:#a3b0a4;--sea:#7fbf8a;--sun:#e9e2b8;--coral:#ef6a5e;--vio:#c79ad8;--line:#263629;--hero-a:#1b0508;--hero-b:#a3231f;--hero-text:#f8eedb}
.hero{background:
 radial-gradient(1.5px 1.5px at 8% 12%,rgba(255,255,255,.85),transparent),
 radial-gradient(1.5px 1.5px at 22% 30%,rgba(255,255,255,.6),transparent),
 radial-gradient(2px 2px at 35% 8%,rgba(255,255,255,.8),transparent),
 radial-gradient(1.5px 1.5px at 62% 20%,rgba(255,255,255,.7),transparent),
 radial-gradient(1.5px 1.5px at 78% 9%,rgba(255,255,255,.85),transparent),
 radial-gradient(2px 2px at 90% 28%,rgba(255,255,255,.6),transparent),
 radial-gradient(1.5px 1.5px at 14% 52%,rgba(255,255,255,.5),transparent),
 radial-gradient(1.5px 1.5px at 94% 55%,rgba(255,255,255,.5),transparent),
 linear-gradient(180deg,#14040a 0%,#5a0d17 35%,#a8281f 70%,#d9532e 100%)}
.hero>*{position:relative;z-index:1}
.hero h1{text-shadow:0 2px 26px rgba(0,0,0,.6)}
.hero svg{height:clamp(300px,52vw,460px);margin-top:1rem}
.lang button[aria-pressed="true"],.hero .btn{background:#e9e2b8;color:#1a0a0a}
.moon{display:block;width:clamp(4.5rem,18vw,6.5rem);aspect-ratio:1;margin:0 auto 1.2rem;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffdf0,#efe8c3 55%,#c9c196);box-shadow:0 0 40px 12px rgba(255,236,190,.45),0 0 110px 40px rgba(255,120,80,.25)}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 38%,rgba(120,110,80,.35) 0 9%,transparent 10%),radial-gradient(circle at 38% 66%,rgba(120,110,80,.3) 0 13%,transparent 14%),radial-gradient(circle at 70% 70%,rgba(120,110,80,.25) 0 6%,transparent 7%)}
.chapter-head{border-left-color:var(--coral)}
.story .first::first-letter{color:var(--coral)}
.m-a{background:#3f7a4d}
.cover{color:#efe8c3;background:linear-gradient(180deg,#6b1218 0%,#2c0a0e 50%,#0a120d 100%);box-shadow:inset 10px 0 0 rgba(0,0,0,.45),inset 0 0 0 10px #12090b,inset 0 0 0 12px #c9c4a0,0 18px 40px rgba(0,0,0,.6)}
.paper{background:linear-gradient(180deg,#16211a,#101812);border-color:#2c3d30}
.paper{position:relative}
.bm{position:absolute;top:-6px;right:1.4rem;width:2.1rem;height:4.4rem;border:0;padding:0;cursor:pointer;background:linear-gradient(180deg,#a3231f,#ef6a5e);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 4px 10px rgba(0,0,0,.4);transition:height .2s}
.bm:hover,.bm:focus-visible{height:5rem}
.egg{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1.5rem;text-align:center;background:radial-gradient(circle at 50% 40%,#1c2620,#050806 70%);color:#e9e3d6}
.egg[hidden]{display:none}
.egg svg{width:min(15rem,60vw);height:auto}
.egg p{margin:0;font-family:"Ruslan Display","Alegreya",Georgia,serif;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.2;max-width:18ch}
.egg button{font:inherit;font-size:1.1rem;padding:.7rem 1.6rem;border-radius:999px;border:0;background:#e9e2b8;color:#1a0a0a;cursor:pointer}
.egg .tip{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.egg.flash::after{content:"";position:absolute;inset:0;background:#fff;pointer-events:none;animation:flash 1.4s ease-out forwards}
@keyframes flash{0%,25%{opacity:1}100%{opacity:0}}

<script>
(function(){
var T={
ru:{
title:`Легенда острова`,
lead:`Они приехали в село не так давно. Никто ещё не знал, чем всё это закончится.`,
start:`Начать читать`,sec:`Раздел`,who:`Кто есть кто`,next:`Это конец`,
nextp:``,foot:`Легенда острова. Пишем вместе.`,
names:{n:`Никита`,i:`Иван`,a:`Андрей`,l:`Аня`,g:`Бабушка Люся`,y:`Илья`},
descs:{n:`Бесстрашный. Первым идёт туда, куда другие боятся.`,i:`По кличке Олень 🦌. Трусоват, зато у него есть своё прозвище.`,a:`Смешной и немного нарцисс.`,l:`Сестра братьев. Добрая и умная.`,g:`Бабушка. Ждёт внуков в селе.`,y:`Приёмный сын бабушки Люси. Живёт с ней в селе.`},
secs:[
{h:`Как всё началось`,t:[
`Это было не так давно. В одно село приехали три брата.`,
`Первого брата звали Никита, второго — Иван, а третьего — Андрей. С ними приехала и их сестра Аня. А в селе их ждали бабушка Люся и её приёмный сын Илья.`,
`Все четверо были совсем разные. Аня была доброй и умной. Андрей был смешным и немного нарциссом. Никита был бесстрашным. А Иван был трусоват, и кличка у него была Олень 🦌.`,
`А теперь приятного чтения.`,
`n|Фух, наконец-то приехали.`,
`i|Да, наконец-то... (сказал Иван своим писклявым голосом)`,
`l|Чего ты так боишься этого села? Почему?`,
`a|Он просто в интернете начитался, что озеро в этом селе проклято.`,
`n|Ха-ха-ха-ха, Олень всему верит!`,
`i|Я не Олень! Хватит меня так называть.`,
`n|А то что? Ударишь меня?`,
`l|А ну, угомонились! Пойдёмте уже к бабушке.`]},
{h:`Дорога к бабушке`,t:[
`a|Боже, в этом селе даже нормального компа нет.`,
`n|Не бойся, Роблокс потянет.`,
`a|Я один раз в него играл, и то сразу вышел.`,
`l|Ну, мы пришли. Заходите уже.`,
`g|Привет, мои любимые внуки!`,
`g|Проходите за стол.`,
`a|А где дед?`,
`g|Он на рыбалку уехал, но оставил вам в подарок две лодки.`,
`n|А нам можно будет поплавать на них?`,
`g|Да, но пока нужно поесть. Пойдёмте за стол.`,
`На столе было много вкусной еды.`,
`i|Спасибо, бабушка, мы поели.`,
`a|Спасибо.`,
`n|Спасибо.`,
`l|Спасибо.`,
`Вдруг кто-то крикнул: «Пацаны!» — и влетел во двор. Это был Илья, мальчик, которого приютила бабушка.`,
`y|Я вас так долго ждал!`,
`n|Братан, я так ждал этой встречи!`,
`Никита и Илья были лучшими друзьями.`,
`a|Ну что, го на речку?`,
`i|Может, не надо? Давайте лучше здесь посидим.`,
`n|Да не парься, Олень, всё будет ок.`,
`l|Реально, не бойся, всё будет хорошо.`,
`i|Ну ладно, пойдёмте... (неуверенно сказал Иван)`]},
{h:`Дорога к озеру через лес`,t:[
`l|В лесу так прикольно!`,
`y|Смотрите, рыжие зайцы!`,
`a|Это же Дейзи из «Дума»!`,
`n|Я думал, озеро дальше, а мы уже пришли.`,
`i|Почему тут такой густой туман?`,
`n|Бу! (подошёл сзади и напугал Ивана)`,
`i|Аааа! (закричал Иван)`,
`l|Вы же братья, должны дружить.`,
`n|С этим лохом так и надо.`,
`y|Всё, давайте уже плыть.`]},
{h:`Похищение`,t:[
`i|На воде так страшно.`,
`a|Не бойся, мы с тобой рядом. Но запомни: спасать тебя я не буду.`,
`l|Ха-ха, как смешно. (сказала с сарказмом Аня)`,
`Чёрная тень проплыла под водой.`,
`i|Что это там под водой? Не трогайте воду!`,
`y|Да не бойся! Ты вот, смотри. (опустил руку в воду) Всё окей.`,
`И тут чёрная лапа с когтями схватила Илью за руку.`,
`n|Какого хера?!`,
`Никита ударил по руке, но чёрная рука поцарапала его и утащила Илью.`,
`n|Бл...`,
`l|Никита!!!`,
`a|Что нам делать?!`,
`i|Нужно плыть на берег!!!`]},
{h:`Остров и разделение команды`,t:[
`l|Иван прав, нам нужно плыть на берег!`,
`n|Нет, он украл моего друга.`,
`l|Как хочешь, мы с Ваней будем плыть к берегу.`,
`n|Ну и плывите. Андрей, ты со мной?`,
`a|Конечно.`,
`l|Наконец-то, вот и берег! Пошли к взрослым.`,
`i|Нет. (неуверенно сказал Иван) Я такой трус... (посмотрел на свои дрожащие руки) Они бы нам помогли. Нам нужно плыть к ним!`,
`l|Ладно, я с тобой. Ведь без меня вы не выживете.`,
`Тем временем у Никиты и Андрея.`,
`a|Куда будем плыть?`,
`n|На остров.`,
`a|Почему туда?`,
`n|Я чувствую, он там.`,
`a|Ладно, го.`,
`Они приплыли на остров.`,
`a|Фу, тут так воняет гнилью, как будто тут кто-то умер.`,
`n|Ага.`,
`Что-то пробежало за деревом с хрустом веток.`,
`n|Что это за хрень там?`,
`Из деревьев выбежало существо, похожее на оленя, только четырёх метров высотой, с облезлой кожей и красными глазами. Даже кости видно, а когти были сантиметров сорок.`,
`n|Что за хрень? Что делать?`,
`a|Бл... Бежать!`,
`У парней так колотилось сердце, будто сейчас выскочит.`,
`Они пытались убежать, но Андрей споткнулся о камень.`,
`a|Ай!`,
`Никита не убежал, а вернулся за ним, но их уже догнал олень.`,
`n|Су...`,
`Никита пытался отбиться палкой, но олень отбил её и поцарапал Никиту за ногу, да так, что ещё немного, и была бы видна кость.`,
`n|Аааа! (через слёзы закричал Никита)`,
`Тем временем у Ани и Ивана.`,
`l|Они скорее всего на острове. Плывём туда!`,
`Они услышали крик Никиты.`,
`i|Плывём туда быстрее!!`]},
{h:`Сова`,t:[
`Тем временем у Никиты и Андрея.`,
`a|Это конец. (сказал дрожащим голосом)`,
`И тут из-за деревьев вылетает сова. Сама не больше метра, максимум, а крылья такие большие, больше чем туловище, и перья острые как ножи. Она бьёт оленя крыльями, царапает когтями, но тут олень бьёт её по крылу и скрывается в лесу.`,
`Сова подходит к Никите, кладёт какие-то травы в рану и куском ткани перевязывает его. Он отключается.`,
`И тут прибегают Иван с Аней.`,
`i|Что это за монстр позади тебя?`,
`a|Не бойся, оно защитило нас.`,
`l|Где Никита?`,
`a|Его ранили.`]},
{h:`Загадки острова`,t:[
`Начался дождь.`,
`l|Что это за существо?`,
`a|Пойдёмте в ту пещеру, там всё объясню.`,
`l|Так что это?`,
`a|Не знаю, но оно спасло нам жизнь.`,
`i|От кого?`,
`a|От такого большого страшного зверя, похожего на оленя.`,
`i|Нам нужно плыть отсюда, Никита может умереть из-за раны.`,
`a|Давайте подождём, пока пройдёт дождь.`,
`l|Нельзя ждать, пойдёмте быстро!!!`,
`a|Ладно.`,
`l|Берите Никиту и быстро идём.`,
`Они пришли к берегу.`,
`l|Что? Где наши лодки!!??`,
`Послышался лай собак.`,
`a|Что это??`,
`l|Собаки, что, не слышишь?`,
`a|Я после оленя уже не радуюсь животным.`,
`И тут их окружила стая собак, но не обычных: они были зелёного цвета, с облезлой кожей, у них были видны органы, и воняло тухлятиной.`,
`a|Что делать? Они нас окружили!`,
`И тут пролетает летучая мышь, сама довольно крупная, с криками, и собаки отвлекаются на неё.`,
`l|Не теряем время, бежим!!`,
`Сквозь туман и густой лес они всё же добираются до таинственного храма.`]},
{h:`Подземелье`,t:[
`На дверях было много пыли и странные символы.`,
`l|Что это такое?`,
`Проснулся Никита.`,
`n|Что?.. Где я? (сказал больным голосом Никита)`,
`a|Наконец-то ты проснулся! Как ты себя чувствуешь?`,
`n|Нормально.`,
`i|Ходить можешь?`,
`n|Да. (поднимается на ноги)`,
`Аня протёрла рукавом всю пыль.`,
`На дверях красовался странный мужчина с длинной бородой. Аня нажала на один из символов, и дверь с ними заговорила.`,
`???: Чтобы войти в подземелье, нужно разгадать загадку. Вы готовы?`,
`l|Давай свою загадку.`,
`???: У него не было прошлого, никто его не видел, но на него все надеются. Кто это?`,
`l|Легко, это завтра.`,
`Двери в подземелье открылись.`,
`l|Пойдёмте.`,
`В подземелье было пыльно и грязно.`,
`a|Смотрите!`,
`В подземелье стояла большая статуя, на ней тоже был мужчина, а вокруг него обвилась большая змея. Над ними было стекло, очень пыльное и грязное.`,
`a|Змея, как в «Гарри Поттере».`,
`l|Какая? Анаконда?`,
`a|Да какая разница!`,
`l|Смотрите, Луна только вышла. Странно, ведь уже скоро утро.`,
`n|Только это тебя смущает?`,
`И тут начала дрожать земля, и с каменной анаконды начали падать камни.`]},
{h:`Анаконда`,t:[
`l|Что за...?`,
`i|Бежим!`,
`a|Куда? Вход заблокирован!`,
`l|Вон та дверь!`,
`Аня показала за змею.`,
`n|Быстрее, она сейчас нас догонит!`,
`Аня потянула ручку вниз.`,
`l|О нет, дверь заперта!`,
`И тут сквозь грязное стекло пробиваются лучи солнца прямо на хвост анаконды, и она потихоньку обратно окаменела.`,
`l|Что за фигня?`,
`n|Она затвердела из-за солнца? Что?`,
`a|Странно.`,
`i|А может, все монстры на острове застыли?`,
`a|Смотрите, вход открылся!`]},
{h:`Сундуки`,t:[
`За открытым входом начинался длинный коридор.`,
`i|Кто-то очень не хотел, чтобы мы сюда попали. И кто-то очень хотел, чтобы мы дошли.`,
`l|Давайте просто идти и ни к чему не прикасаться.`,
`В конце коридора стоял большой золотой сундук. Он светился и тихонько гудел.`,
`a|СУНДУК!!!`,
`Внутри лежала тяжёлая золотая монета с черепом.`,
`a|Я НАШЁЛ ПИРАТСКИЙ ЖЕТОН!!!`,
`a|Это ЛЕГЕНДАРНЫЙ ПИРАТСКИЙ ЖЕТОН! Такие бывают только на острове!`,
`Под монетой лежал маленький синий пузырёк, а рядом ещё один.`,
`a|ЩИТОВОЕ ЗЕЛЬЕ! Никита, пей, быстро!`,
`Никита недоверчиво понюхал и выпил.`,
`n|Странно... Рана перестала болеть. Совсем.`,
`l|Откуда ты вообще знаешь, что это такое?`,
`i|Он просто слишком много играл.`,
`Стена напротив была исписана старыми буквами. Аня вытерла пыль рукавом и прочитала вслух.`,
`l|«Тот, кто принесёт свет, откроет сердце острова. Но сердце острова не любит свет».`,
`И тут пол мелко задрожал. Из-под дверей в конце коридора поползла чёрная дымка.`,
`a|ШТОРМ СУЖАЕТСЯ! Бежим в центр!`,
`l|Просто бежим!!`]},
{h:`Шторм`,t:[
`Чёрная дымка ползла за ними медленно, но верно, и с каждой минутой кольцо вокруг них становилось всё уже.`,
`a|Нам нужна безопасная зона!`,
`l|Вон там свет, смотрите!`,
`В большом круглом зале потолок был из стекла. Сквозь грязь пробивался слабый солнечный луч и рисовал на полу светлый круг.`,
`Все встали внутри круга. Дымка остановилась, словно упёрлась в невидимую стену.`,
`i|Она не заходит в свет.`,
`a|Мы ВНУТРИ зоны. Всё по правилам!`,
`Из дымки раздался низкий голос. Он был таким тихим, что, казалось, звучал у каждого прямо в голове.`,
`???: Дети солнца... Вы такие маленькие. Такие тёплые.`,
`???: Я тот, кого вы зовёте тьмой. Я тот, кто унёс вашего друга.`,
`i|Илья! Где он?!`,
`???: Он в моём сердце. Если хотите вернуть его, придите за ним.`,
`Дымка расступилась, и в стене открылась тяжёлая каменная дверь. За ней виднелась лестница, уходящая вниз.`,
`a|Заберём Илью и ещё лут по дороге.`,
`Внизу была огромная пещера, а над пропастью висела клетка из чёрных пальцев.`,
`В клетке сидел Илья.`,
`y|Ребята... не подходите! Это...`,
`Он не успел договорить.`]},
{h:`Чёрная Рука`,t:[
`Из пропасти поднялась огромная рука. Она была из дыма и тёмных теней, а каждый её палец был длиной с дерево.`,
`???: Добро пожаловать в сердце острова.`,
`l|Отпусти Илью!`,
`???: Я не держу его. Он сам остался. Он тоже боится света.`,
`???: Мне нужен свет. Весь свет. Когда солнце погаснет, остров будет только мой.`,
`Аня огляделась. По бокам пещеры стояли два больших каменных колеса с зеркалами, а вверху виднелось стекло, сквозь которое пробивался луч.`,
`l|Смотрите. Зеркала. Они могут направить луч прямо на неё.`,
`На колёсах была выбита надпись, и Никита прочитал её вслух.`,
`n|«Кто повернёт колесо, не сможет отпустить его, пока горит свет».`,
`i|То есть двое должны стоять тут и держать зеркала, пока солнце не взойдёт?`,
`n|Нет. Пока свет горит. А горит он, пока кто-то держит.`,
`a|Тогда я встану!`,
`l|Нет, Андрей. Ты нужен Илье. И Ване. Ты их друг.`,
`Никита подошёл к одному колесу, Аня к другому.`,
`n|Я всё равно уже раз чуть не умер. Как-то привык.`,
`l|Мы справимся. Я обещаю.`,
`a|Ребята, не надо...`,
`Но Аня и Никита уже взялись за колёса.`,
`???: Глупые дети. Вы и правда думаете, что света хватит?`,
`Аня повернула колесо, и зеркало вспыхнуло.`]},
{h:`Свет`,t:[
`Луч ударил в чёрную руку, и пещера содрогнулась от крика.`,
`Пальцы дымились, а клетка с Ильёй медленно опускалась на каменный выступ.`,
`Андрей и Ваня подхватили Илью и вытащили его из клетки.`,
`y|Спасибо... Вы пришли.`,
`Но луч становился всё ярче, и колёса под руками Ани и Никиты начали светиться.`,
`n|Аня... Мне тепло.`,
`l|Мне тоже.`,
`a|Что с вами?! Отпустите колёса! Быстрее!`,
`n|Мы не можем, Андрей. Мы же знали.`,
`l|Не надо. Правда, не надо.`,
`Аня посмотрела на Ваню и Андрея и улыбнулась.`,
`l|Вы самые лучшие друзья на свете. Не забывайте нас.`,
`n|И не грустите слишком долго. Мы будем смотреть сверху.`,
`Свет стал таким ярким, что все закрыли глаза.`,
`Когда они открыли их, у колёс уже никого не было. Только два тёплых светлых пятна на камне.`,
`y|Это... из-за меня.`,
`a|Нет, Илья. Это не из-за тебя.`,
`Луч задрожал и погас. Наверху сгустились тучи, и стекло потемнело.`,
`Чёрная рука поднялась ещё выше, и пещера наполнилась её смехом.`,
`???: Они были храбрыми. Но теперь вас осталось трое.`,
`Андрей вытер лицо рукавом и посмотрел наверх.`,
`a|Ваня. Нам нужно подняться над тучами.`]},
{h:`Автобус`,t:[
`a|Солнце за тучами. Если мы поднимемся выше, мы сами принесём свет.`,
`Андрей оглядел пещеру. Вокруг валялись огромные куски камня.`,
`a|Я думаю... Я попробую одну штуку.`,
`Он вдохнул и крикнул, как будто делал это каждый день.`,
`a|ПОСТРОЙ СТЕНУ! РАМПУ! КРЫШУ!`,
`Камни дрогнули, поднялись в воздух и сами сложились в лестницу, которая побежала вверх прямо сквозь потолок.`,
`Они взобрались наверх: Андрей, Ваня и Илья, которого ребята почти несли на руках.`,
`Лестница пробила стекло, прошла сквозь чёрные тучи и вывела их на яркое голубое небо.`,
`Над облаками висел огромный голубой автобус с большим воздушным шаром.`,
`a|БОЕВОЙ АВТОБУС!!!`,
`В автобусе было пусто. На месте водителя лежала старая кассета с надписью «ТАНЦЫ».`,
`Ваня поднял её и повертел в руках.`,
`a|Включай!`,
`Ваня сунул кассету в старый магнитофон, и по облакам разнеслась весёлая музыка.`,
`Автобус вздрогнул, взревел и поплыл вниз, к острову.`,
`a|У меня есть очень хороший план.`,
`i|Какой?`,
`a|Мы выйдем из автобуса и будем танцевать.`,
`i|ЧТО?!`]},
{h:`Танец`,t:[
`Автобус завис над пещерой. Снизу на них смотрела огромная чёрная рука.`,
`???: Вы вернулись. Вас правда осталось трое?`,
`a|Нас ровно столько, сколько нужно.`,
`Андрей открыл дверь автобуса и, не раздумывая, прыгнул вниз. Над ним раскрылся огромный зонтик. Ваня зажмурился и прыгнул следом.`,
`Они приземлились прямо перед чёрной рукой. Музыка с кассеты гремела на весь остров.`,
`a|Мы пришли не драться. Мы пришли танцевать.`,
`Андрей широко расставил руки, замахал ими как безумный и закрутился на месте.`,
`Ваня смотрел на него секунду. Потом глубоко вдохнул и начал танцевать рядом, ещё нелепее.`,
`???: Что вы делаете? Прекратите...`,
`a|Ты ещё не видела меня на зубной нити!`,
`Андрей начал размахивать руками, как на зубной нити. Рука замерла.`,
`Из тоннелей вышли зелёные собаки с облезлой кожей, большой олень и огромная летучая мышь.`,
`Но собаки остановились. Одна из них неуверенно подёргала лапой в такт музыке.`,
`Олень начал качать рогами, а летучая мышь закружилась под самым потолком.`,
`a|Страх не выносит смеха!`,
`Чёрная рука задрожала. Её пальцы начали рассыпаться.`,
`???: Прекратите! Это невозможно! Я ведь... Я ведь тьма...`,
`a|А мы просто люди, которые любят танцевать!`,
`Громко грянул последний аккорд, и тучи над островом разошлись.`,
`Яркий солнечный луч ударил прямо в центр пещеры.`]},
{h:`Победа`,t:[
`Когда луч коснулся чёрной руки, она вспыхнула золотом и рассыпалась тысячей светящихся пылинок.`,
`Они поднялись к самому небу и растворились в утреннем воздухе.`,
`Пещера стихла. Монстры застыли, и их шкуры превратились в камень.`,
`Ваня упал на пол и засмеялся. Потом вдруг заплакал. Потом снова засмеялся.`,
`Андрей вытащил из кармана тяжёлую золотую монету с черепом.`,
`a|Положим её у колёс. Пусть будет у них.`,
`Они вернулись к зеркалам, и Андрей положил монету на камень.`,
`Над колёсами в луче света дрожало что-то яркое и тёплое.`,
`Это были два маленьких огонька, которые неспешно поднимались вверх.`,
`l|Мы же говорили, что будем смотреть сверху.`,
`n|Только не забудьте нас.`,
`Голоса Ани и Никиты звучали совсем тихо. Ваня вытер лицо рукавом.`,
`i|Не забудем. Никогда.`,
`Огоньки поднялись выше, вышли сквозь разбитое стекло и растворились в утреннем небе.`,
`Они вышли из храма. Туман уходил, а на берегу, как ни в чём не бывало, покачивались их лодки.`,
`Они сели в лодки. Ваня греб молча. Андрей смотрел на светлое небо, где ещё не растаяли две последние звёзды.`,
`a|ПОБЕДА!`,
`a|ТОП-1!`,
`a|Просто хотел, чтобы им там, наверху, было весело.`,
`Ваня улыбнулся впервые за долгое время.`,
`И где-то высоко, на самом краю рассвета, две звёзды мигнули в ответ.`]}]},
uk:{
title:`Легенда острова`,
lead:`Вони приїхали в село не так давно. Ніхто ще не знав, чим усе це закінчиться.`,
start:`Почати читати`,sec:`Розділ`,who:`Хто є хто`,next:`Це кінець`,
nextp:``,foot:`Легенда острова. Пишемо разом.`,
names:{n:`Микита`,i:`Іван`,a:`Андрій`,l:`Аня`,g:`Бабуся Люся`,y:`Ілля`},
descs:{n:`Безстрашний. Першим іде туди, куди інші бояться.`,i:`На прізвисько Олень 🦌. Полохливий, зате має своє прізвисько.`,a:`Смішний і трохи нарцис.`,l:`Сестра братів. Добра й розумна.`,g:`Бабуся. Чекає на онуків у селі.`,y:`Прийомний син бабусі Люсі. Живе з нею в селі.`},
secs:[
{h:`Як усе почалося`,t:[
`Це було не так давно. В одне село приїхали три брати.`,
`Першого брата звали Микита, другого — Іван, а третього — Андрій. З ними приїхала й їхня сестра Аня. А в селі на них чекали бабуся Люся та її прийомний син Ілля.`,
`Усі четверо були зовсім різні. Аня була доброю й розумною. Андрій був смішним і трохи нарцисом. Микита був безстрашним. А Іван був полохливий, і прізвисько в нього було Олень 🦌.`,
`А тепер приємного читання.`,
`n|Фух, нарешті приїхали.`,
`i|Так, нарешті... (сказав Іван своїм писклявим голосом)`,
`l|Чого ти так боїшся цього села? Чому?`,
`a|Він просто в інтернеті начитався, що озеро в цьому селі прокляте.`,
`n|Ха-ха-ха-ха, Олень усьому вірить!`,
`i|Я не Олень! Годі мене так називати.`,
`n|А то що? Вдариш мене?`,
`l|А ну, вгамувалися! Ходімо вже до бабусі.`]},
{h:`Дорога до бабусі`,t:[
`a|Боже, у цьому селі навіть нормального компа нема.`,
`n|Не бійся, Роблокс потягне.`,
`a|Я один раз у нього грав, і то відразу вийшов.`,
`l|Ну, ми прийшли. Заходьте вже.`,
`g|Привіт, мої любі внуки!`,
`g|Проходьте до столу.`,
`a|А де дід?`,
`g|Він поїхав на рибалку, але залишив вам у подарунок два човни.`,
`n|А нам можна буде поплавати на них?`,
`g|Так, але спочатку треба поїсти. Ходімо до столу.`,
`На столі було багато смачної їжі.`,
`i|Дякую, бабусю, ми поїли.`,
`a|Дякую.`,
`n|Дякую.`,
`l|Дякую.`,
`Раптом хтось крикнув: «Пацани!» — і влетів у двір. Це був Ілля, хлопчик, якого прихистила бабуся.`,
`y|Я вас так довго чекав!`,
`n|Братан, я так чекав цієї зустрічі!`,
`Микита й Ілля були найкращими друзями.`,
`a|Ну що, го на річку?`,
`i|Може, не треба? Давайте краще тут посидимо.`,
`n|Та не парся, Олень, усе буде ок.`,
`l|Реально, не бійся, усе буде добре.`,
`i|Ну гаразд, ходімо... (невпевнено сказав Іван)`]},
{h:`Дорога до озера через ліс`,t:[
`l|У лісі так прикольно!`,
`y|Дивіться, руді зайці!`,
`a|Це ж Дейзі з «Дума»!`,
`n|Я думав, озеро далі, а ми вже прийшли.`,
`i|Чому тут такий густий туман?`,
`n|Бу! (підійшов ззаду й налякав Івана)`,
`i|Аааа! (закричав Іван)`,
`l|Ви ж брати, маєте дружити.`,
`n|З цим лохом так і треба.`,
`y|Усе, давайте вже пливти.`]},
{h:`Викрадення`,t:[
`i|На воді так страшно.`,
`a|Не бійся, ми з тобою поруч. Але запам’ятай: рятувати тебе я не буду.`,
`l|Ха-ха, як смішно. (сказала з сарказмом Аня)`,
`Чорна тінь проплила під водою.`,
`i|Що це там під водою? Не чіпайте воду!`,
`y|Та не бійся! Ти ось дивись. (опустив руку у воду) Усе окей.`,
`І тут чорна лапа з кігтями схопила Іллю за руку.`,
`n|Якого біса?!`,
`Микита вдарив по руці, але чорна рука подряпала його й потягла Іллю.`,
`n|Блін...`,
`l|Микита!!!`,
`a|Що нам робити?!`,
`i|Треба пливти на берег!!!`]},
{h:`Острів і розділення команди`,t:[
`l|Іван має рацію, нам треба пливти до берега!`,
`n|Ні, він украв мого друга.`,
`l|Як хочеш, ми з Ванею попливемо до берега.`,
`n|Ну й пливіть. Андрію, ти зі мною?`,
`a|Звісно.`,
`l|Нарешті, ось і берег! Ходімо до дорослих.`,
`i|Ні. (невпевнено сказав Іван) Я такий боягуз... (подивився на свої тремтячі руки) Вони б нам допомогли. Нам треба пливти до них!`,
`l|Гаразд, я з тобою. Адже без мене ви не виживете.`,
`Тим часом у Микити й Андрія.`,
`a|Куди пливтимемо?`,
`n|На острів.`,
`a|Чому туди?`,
`n|Я відчуваю, він там.`,
`a|Гаразд, го.`,
`Вони припливли на острів.`,
`a|Фу, тут так тхне гниллям, ніби тут хтось помер.`,
`n|Ага.`,
`Щось пробігло за деревом із хрускотом гілок.`,
`n|Що це за дичина там?`,
`З-за дерев вибігла істота, схожа на оленя, тільки чотири метри заввишки, з облізлою шкірою та червоними очима. Навіть кістки видно, а кігті були сантиметрів сорок.`,
`n|Що за дичина? Що робити?`,
`a|Блін... Тікати!`,
`У хлопців так калатало серце, ніби зараз вискочить.`,
`Вони намагалися втекти, але Андрій спіткнувся об камінь.`,
`a|Ай!`,
`Микита не втік, а повернувся по нього, але їх уже наздогнав олень.`,
`n|Зараза...`,
`Микита намагався відбитися палицею, але олень відбив її й подряпав Микиту по нозі, та так, що ще трохи — і було б видно кістку.`,
`n|Аааа! (крізь сльози закричав Микита)`,
`Тим часом в Ані та Івана.`,
`l|Вони, скоріше за все, на острові. Пливемо туди!`,
`Вони почули крик Микити.`,
`i|Пливемо туди швидше!!`]},
{h:`Сова`,t:[
`Тим часом у Микити й Андрія.`,
`a|Це кінець. (сказав тремтячим голосом)`,
`І тут з-за дерев вилітає сова. Сама не більша за метр, максимум, а крила такі великі, більші за тулуб, і пір’їни гострі як ножі. Вона б’є оленя крилами, дряпає кігтями, але тут олень б’є її по крилу й зникає в лісі.`,
`Сова підходить до Микити, кладе якісь трави в рану й шматком тканини перев’язує його. Він втрачає свідомість.`,
`І тут прибігають Іван з Анею.`,
`i|Що це за монстр позаду тебе?`,
`a|Не бійся, воно захистило нас.`,
`l|Де Микита?`,
`a|Його поранили.`]},
{h:`Загадки острова`,t:[
`Почався дощ.`,
`l|Що це за істота?`,
`a|Ходімо до тієї печери, там усе поясню.`,
`l|Так що це?`,
`a|Не знаю, але воно врятувало нам життя.`,
`i|Від кого?`,
`a|Від такого великого страшного звіра, схожого на оленя.`,
`i|Нам треба пливти звідси, Микита може померти через рану.`,
`a|Давайте зачекаємо, поки мине дощ.`,
`l|Не можна чекати, ходімо швидко!!!`,
`a|Гаразд.`,
`l|Беріть Микиту й швидко йдемо.`,
`Вони дійшли до берега.`,
`l|Що? Де наші човни!!??`,
`Почувся гавкіт собак.`,
`a|Що це??`,
`l|Собаки, що, не чуєш?`,
`a|Після оленя я вже не радію тваринам.`,
`І тут їх оточила зграя собак, але не звичайних: вони були зеленого кольору, з облізлою шкірою, у них було видно органи, і смерділо тухлятиною.`,
`a|Що робити? Вони нас оточили!`,
`І тут пролітає кажан, сам доволі великий, із криками, і собаки відволікаються на нього.`,
`l|Не гаємо часу, біжимо!!`,
`Крізь туман і густий ліс вони все ж дістаються до таємничого храму.`]},
{h:`Підземелля`,t:[
`На дверях було багато пилу і дивні символи.`,
`l|Що це таке?`,
`Прокинувся Микита.`,
`n|Що?.. Де я? (сказав хворим голосом Микита)`,
`a|Нарешті ти прокинувся! Як ти себе почуваєш?`,
`n|Нормально.`,
`i|Ходити можеш?`,
`n|Так. (підводиться на ноги)`,
`Аня витерла рукавом увесь пил.`,
`На дверях красувався дивний чоловік з довгою бородою. Аня натиснула на один із символів, і двері з ними заговорили.`,
`???: Щоб увійти в підземелля, треба розгадати загадку. Ви готові?`,
`l|Давай свою загадку.`,
`???: У нього не було минулого, ніхто його не бачив, але на нього всі сподіваються. Хто це?`,
`l|Легко, це завтра.`,
`Двері в підземелля відчинилися.`,
`l|Ходімо.`,
`У підземеллі було запилено і брудно.`,
`a|Дивіться!`,
`У підземеллі стояла велика статуя, на ній теж був чоловік, а навколо нього обвилася велика змія. Над ними було скло, дуже запилене й брудне.`,
`a|Змія, як у «Гаррі Поттері».`,
`l|Яка? Анаконда?`,
`a|Та яка різниця!`,
`l|Дивіться, Місяць тільки зійшов. Дивно, адже вже скоро ранок.`,
`n|Тільки це тебе бентежить?`,
`І тут почала дрижати земля, і з кам’яної анаконди почали падати камені.`]},
{h:`Анаконда`,t:[
`l|Що за...?`,
`i|Біжимо!`,
`a|Куди? Вхід заблоковано!`,
`l|Он ті двері!`,
`Аня показала за змію.`,
`n|Швидше, вона зараз нас наздожене!`,
`Аня потягнула ручку вниз.`,
`l|О ні, двері зачинені!`,
`І тут крізь брудне скло пробиваються промені сонця прямо на хвіст анаконди, і вона потихеньку знову скам’яніла.`,
`l|Що за дурня?`,
`n|Вона затверділа через сонце? Що?`,
`a|Дивно.`,
`i|А може, всі монстри на острові застигли?`,
`a|Дивіться, вхід відкрився!`]},
{h:`Скрині`,t:[
`За відчиненим входом починався довгий коридор.`,
`i|Хтось дуже не хотів, щоб ми сюди потрапили. І хтось дуже хотів, щоб ми дійшли.`,
`l|Давайте просто йти і ні до чого не торкатися.`,
`У кінці коридору стояла велика золота скриня. Вона світилася й тихенько гуділа.`,
`a|СКРИНЯ!!!`,
`Усередині лежала важка золота монета з черепом.`,
`a|Я ЗНАЙШОВ ПІРАТСЬКИЙ ЖЕТОН!!!`,
`a|Це ЛЕГЕНДАРНИЙ ПІРАТСЬКИЙ ЖЕТОН! Такі бувають тільки на острові!`,
`Під монетою лежав маленька синя пляшечка, а поруч ще одна.`,
`a|ЩИТОВЕ ЗІЛЛЯ! Микито, пий, швидко!`,
`Микита недовірливо понюхав і випив.`,
`n|Дивно... Рана перестала боліти. Зовсім.`,
`l|Звідки ти взагалі знаєш, що це таке?`,
`i|Він просто занадто багато грав.`,
`Стіна навпроти була списана старими літерами. Аня витерла пил рукавом і прочитала вголос.`,
`l|«Той, хто принесе світло, відкриє серце острова. Але серце острова не любить світла».`,
`І тут підлога дрібно затремтіла. Із-під дверей у кінці коридору поповзла чорна імла.`,
`a|ШТОРМ ЗВУЖУЄТЬСЯ! Біжимо в центр!`,
`l|Просто біжимо!!`]},
{h:`Шторм`,t:[
`Чорна імла повзла за ними повільно, але впевнено, і з кожною хвилиною кільце навколо них ставало все вужчим.`,
`a|Нам потрібна безпечна зона!`,
`l|Он там світло, дивіться!`,
`У великому круглому залі стеля була зі скла. Крізь бруд пробивався слабкий сонячний промінь і малював на підлозі світле коло.`,
`Усі стали всередині кола. Імла зупинилася, ніби вперлася в невидиму стіну.`,
`i|Вона не заходить у світло.`,
`a|Ми ВСЕРЕДИНІ зони. Усе за правилами!`,
`З імли пролунав низький голос. Він був таким тихим, що, здавалося, звучав у кожного просто в голові.`,
`???: Діти сонця... Ви такі маленькі. Такі теплі.`,
`???: Я той, кого ви називаєте темрявою. Я той, хто забрав вашого друга.`,
`i|Ілля! Де він?!`,
`???: Він у моєму серці. Якщо хочете повернути його, прийдіть по нього.`,
`Імла розступилася, і в стіні відчинилися важкі кам’яні двері. За ними виднілися сходи, що вели вниз.`,
`a|Заберемо Іллю і ще лут по дорозі.`,
`Унизу була величезна печера, а над прірвою висіла клітка з чорних пальців.`,
`У клітці сидів Ілля.`,
`y|Хлопці... не підходьте! Це...`,
`Він не встиг договорити.`]},
{h:`Чорна Рука`,t:[
`З прірви піднялася величезна рука. Вона була з диму й темних тіней, а кожен її палець був завдовжки з дерево.`,
`???: Ласкаво просимо в серце острова.`,
`l|Відпусти Іллю!`,
`???: Я не тримаю його. Він сам залишився. Він теж боїться світла.`,
`???: Мені потрібне світло. Усе світло. Коли сонце згасне, острів буде тільки моїм.`,
`Аня роззирнулася. По боках печери стояли два великі кам’яні колеса із дзеркалами, а вгорі виднілося скло, крізь яке пробивався промінь.`,
`l|Дивіться. Дзеркала. Вони можуть спрямувати промінь просто на неї.`,
`На колесах був вибитий напис, і Микита прочитав його вголос.`,
`n|«Хто поверне колесо, не зможе відпустити його, поки горить світло».`,
`i|Тобто двоє мають стояти тут і тримати дзеркала, поки сонце не зійде?`,
`n|Ні. Поки світло горить. А горить воно, поки хтось тримає.`,
`a|Тоді я стану!`,
`l|Ні, Андрію. Ти потрібен Іллі. І Вані. Ти їхній друг.`,
`Микита підійшов до одного колеса, Аня до іншого.`,
`n|Я все одно вже раз ледь не помер. Якось звик.`,
`l|Ми впораємося. Я обіцяю.`,
`a|Хлопці, не треба...`,
`Але Аня й Микита вже взялися за колеса.`,
`???: Дурні діти. Ви й справді думаєте, що світла вистачить?`,
`Аня повернула колесо, і дзеркало спалахнуло.`]},
{h:`Світло`,t:[
`Промінь вдарив у чорну руку, і печера здригнулася від крику.`,
`Пальці димилися, а клітка з Іллею повільно опускалася на кам’яний виступ.`,
`Андрій і Ваня підхопили Іллю й витягли його з клітки.`,
`y|Дякую... Ви прийшли.`,
`Але промінь ставав усе яскравішим, і колеса під руками Ані та Микити почали світитися.`,
`n|Аню... Мені тепло.`,
`l|Мені теж.`,
`a|Що з вами?! Відпустіть колеса! Швидше!`,
`n|Ми не можемо, Андрію. Ми ж знали.`,
`l|Не треба. Справді, не треба.`,
`Аня подивилася на Ваню й Андрія і всміхнулася.`,
`l|Ви найкращі друзі на світі. Не забувайте нас.`,
`n|І не сумуйте надто довго. Ми дивитимемося зверху.`,
`Світло стало таким яскравим, що всі заплющили очі.`,
`Коли вони розплющили їх, біля коліс уже нікого не було. Лише дві теплі світлі плями на камені.`,
`y|Це... через мене.`,
`a|Ні, Ілля. Це не через тебе.`,
`Промінь здригнувся й погас. Угорі зібралися хмари, і скло потемніло.`,
`Чорна рука піднялася ще вище, і печера наповнилася її сміхом.`,
`???: Вони були хоробрими. Але тепер вас лишилося троє.`,
`Андрій витер обличчя рукавом і подивився вгору.`,
`a|Ваню. Нам потрібно піднятися над хмарами.`]},
{h:`Автобус`,t:[
`a|Сонце за хмарами. Якщо ми піднімемося вище, ми самі принесемо світло.`,
`Андрій оглянув печеру. Навколо валялися величезні шматки каменю.`,
`a|Я думаю... Я спробую одну штуку.`,
`Він вдихнув і крикнув, ніби робив це щодня.`,
`a|ПОБУДУЙ СТІНУ! РАМПУ! ДАХ!`,
`Каміння сіпнулося, піднялося в повітря і саме склалося в сходи, які побігли вгору просто крізь стелю.`,
`Вони піднялися нагору: Андрій, Ваня та Ілля, якого хлопці майже несли на руках.`,
`Сходи пробили скло, пройшли крізь чорні хмари й вивели їх на яскраве блакитне небо.`,
`Над хмарами висів величезний блакитний автобус з великою повітряною кулею.`,
`a|БОЙОВИЙ АВТОБУС!!!`,
`В автобусі було порожньо. На місці водія лежала стара касета з написом «ТАНЦІ».`,
`Ваня підняв її й покрутив у руках.`,
`a|Вмикай!`,
`Ваня вставив касету в старий магнітофон, і над хмарами рознеслася весела музика.`,
`Автобус здригнувся, заревів і поплив униз, до острова.`,
`a|У мене є дуже гарний план.`,
`i|Який?`,
`a|Ми вийдемо з автобуса і танцюватимемо.`,
`i|ЩО?!`]},
{h:`Танець`,t:[
`Автобус завис над печерою. Знизу на них дивилася величезна чорна рука.`,
`???: Ви повернулися. Вас справді лишилося троє?`,
`a|Нас рівно стільки, скільки треба.`,
`Андрій відчинив двері автобуса й, не вагаючись, стрибнув униз. Над ним розкрилася величезна парасоля. Ваня заплющив очі й стрибнув слідом.`,
`Вони приземлилися просто перед чорною рукою. Музика з касети гриміла на весь острів.`,
`a|Ми прийшли не битися. Ми прийшли танцювати.`,
`Андрій широко розставив руки, замахав ними як навіжений і закрутився на місці.`,
`Ваня дивився на нього секунду. Потім глибоко вдихнув і почав танцювати поруч, ще безглуздіше.`,
`???: Що ви робите? Припиніть...`,
`a|Ти ще не бачила мене на зубній нитці!`,
`Андрій почав розмахувати руками, як на зубній нитці. Рука завмерла.`,
`З тунелів вийшли зелені собаки з облізлою шкірою, великий олень і величезний кажан.`,
`Але собаки зупинилися. Одна з них невпевнено сіпнула лапою в такт музиці.`,
`Олень почав хитати рогами, а кажан закружляв під самою стелею.`,
`a|Страх не витримує сміху!`,
`Чорна рука затремтіла. Її пальці почали розсипатися.`,
`???: Припиніть! Це неможливо! Я ж... Я ж темрява...`,
`a|А ми просто люди, які люблять танцювати!`,
`Гучно прогримів останній акорд, і хмари над островом розійшлися.`,
`Яскравий сонячний промінь вдарив просто в центр печери.`]},
{h:`Перемога`,t:[
`Коли промінь торкнувся чорної руки, вона спалахнула золотом і розсипалася тисячею світних порошинок.`,
`Вони піднялися до самого неба й розчинилися в ранковому повітрі.`,
`Печера стихла. Монстри застигли, і їхня шкіра перетворилася на камінь.`,
`Ваня впав на підлогу й засміявся. Потім раптом заплакав. Потім знову засміявся.`,
`Андрій витяг із кишені важку золоту монету з черепом.`,
`a|Покладемо її біля коліс. Нехай буде в них.`,
`Вони повернулися до дзеркал, і Андрій поклав монету на камінь.`,
`Над колесами в промені світла тремтіло щось яскраве й тепле.`,
`Це були два маленькі вогники, які неквапно піднімалися вгору.`,
`l|Ми ж казали, що дивитимемося зверху.`,
`n|Тільки не забудьте нас.`,
`Голоси Ані та Микити звучали зовсім тихо. Ваня витер обличчя рукавом.`,
`i|Не забудемо. Ніколи.`,
`Вогники піднялися вище, вийшли крізь розбите скло й розчинилися в ранковому небі.`,
`Вони вийшли з храму. Туман відходив, а на березі, як ні в чому не бувало, погойдувалися їхні човни.`,
`Вони сіли в човни. Ваня веслував мовчки. Андрій дивився на світле небо, де ще не розтанули дві останні зорі.`,
`a|ПЕРЕМОГА!`,
`a|ТОП-1!`,
`a|Просто хотів, щоб їм там, нагорі, було весело.`,
`Ваня усміхнувся вперше за довгий час.`,
`І десь високо, на самому краю світанку, дві зорі мигнули у відповідь.`]}]},
en:{
title:`Legend of the Island`,
lead:`They arrived in the village not so long ago. No one yet knew how it would all end.`,
start:`Start reading`,sec:`Section`,who:`Who is who`,next:`This is the end`,
nextp:``,foot:`Legend of the Island. Written together.`,
names:{n:`Nikita`,i:`Ivan`,a:`Andrey`,l:`Anya`,g:`Grandma Lyusya`,y:`Ilya`},
descs:{n:`Fearless. Goes first where others are afraid to go.`,i:`Nicknamed the Deer 🦌. Timid, but he has a nickname of his own.`,a:`Funny and a bit of a narcissist.`,l:`The brothers’ sister. Kind and smart.`,g:`Grandma. Waits for her grandchildren in the village.`,y:`Grandma Lyusya’s adopted son. Lives with her in the village.`},
secs:[
{h:`How It All Began`,t:[
`It was not so long ago. Three brothers came to a village.`,
`The first brother was called Nikita, the second Ivan, and the third Andrey. Their sister Anya came with them. In the village, Grandma Lyusya and her adopted son Ilya were waiting for them.`,
`All four were very different. Anya was kind and smart. Andrey was funny and a bit of a narcissist. Nikita was fearless. And Ivan was timid, and his nickname was the Deer 🦌.`,
`And now, enjoy the read.`,
`n|Phew, we’ve finally arrived.`,
`i|Yeah, finally... (said Ivan in his squeaky voice)`,
`l|Why are you so afraid of this village? What’s wrong?`,
`a|He just read online that the lake in this village is cursed.`,
`n|Ha-ha-ha-ha, the Deer believes everything!`,
`i|I’m not a Deer! Stop calling me that.`,
`n|Or what? You’ll hit me?`,
`l|Okay, calm down, all of you! Let’s go to Grandma’s already.`]},
{h:`The Road to Grandma’s`,t:[
`a|Oh my God, this village doesn’t even have a decent computer.`,
`n|Don’t worry, Roblox will run fine.`,
`a|I played it once, and I quit right away.`,
`l|Well, we’re here. Come on in.`,
`g|Hello, my dear grandchildren!`,
`g|Come to the table.`,
`a|Where’s Grandpa?`,
`g|He went fishing, but he left you two boats as a present.`,
`n|Can we go sailing on them?`,
`g|Yes, but first you need to eat. Come to the table.`,
`There was a lot of tasty food on the table.`,
`i|Thank you, Grandma, we’ve eaten.`,
`a|Thanks.`,
`n|Thanks.`,
`l|Thanks.`,
`Suddenly someone shouted, “Guys!” and ran into the yard. It was Ilya, a boy whom Grandma had taken in.`,
`y|I’ve been waiting for you for so long!`,
`n|Bro, I’ve been looking forward to this meeting so much!`,
`Nikita and Ilya were best friends.`,
`a|So, are we going to the river?`,
`i|Maybe we shouldn’t? Let’s stay here instead.`,
`n|Don’t worry, Deer, everything will be fine.`,
`l|Seriously, don’t be afraid, everything will be fine.`,
`i|Okay, let’s go... (said Ivan uncertainly)`]},
{h:`The Road to the Lake Through the Forest`,t:[
`l|The forest is so cool!`,
`y|Look, ginger hares!`,
`a|That’s Daisy from Doom!`,
`n|I thought the lake was farther, but we’ve already arrived.`,
`i|Why is the fog so thick here?`,
`n|Boo! (came up from behind and scared Ivan)`,
`i|Aaaah! (Ivan screamed)`,
`l|You’re brothers, you should be friends.`,
`n|This loser deserves it.`,
`y|Okay, let’s sail already.`]},
{h:`The Abduction`,t:[
`i|It’s so scary on the water.`,
`a|Don’t be afraid, we’re right beside you. But remember: I won’t save you.`,
`l|Ha-ha, so funny. (said Anya sarcastically)`,
`A black shadow swam past under the water.`,
`i|What’s that under the water? Don’t touch the water!`,
`y|Don’t be afraid! Look, watch. (put his hand in the water) See, it’s okay.`,
`And then a black paw with claws grabbed Ilya by the hand.`,
`n|What the hell?!`,
`Nikita hit the arm, but the black hand scratched him and dragged Ilya away.`,
`n|Damn...`,
`l|Nikita!!!`,
`a|What do we do?!`,
`i|We need to head for the shore!!!`]},
{h:`The Island and the Team Splits Up`,t:[
`l|Ivan is right, we need to head for the shore!`,
`n|No, it stole my friend.`,
`l|Suit yourself, Ivan and I will head for the shore.`,
`n|Fine, go. Andrey, are you with me?`,
`a|Of course.`,
`l|Finally, there’s the shore! Let’s go to the adults.`,
`i|No. (said Ivan uncertainly) I’m such a coward... (looked at his trembling hands) They would have helped us. We need to go to them!`,
`l|Fine, I’m with you. You won’t survive without me anyway.`,
`Meanwhile, with Nikita and Andrey.`,
`a|Where are we sailing?`,
`n|To the island.`,
`a|Why there?`,
`n|I can feel he’s there.`,
`a|Okay, let’s go.`,
`They reached the island.`,
`a|Ugh, it stinks of rot here, as if someone died.`,
`n|Yeah.`,
`Something ran behind a tree with a crack of branches.`,
`n|What the heck is that?`,
`A creature that looked like a deer came running out of the trees, but four meters tall, with mangy skin and red eyes. You could even see its bones, and its claws were about forty centimeters long.`,
`n|What the heck is that thing? What do we do?`,
`a|Damn... Run!`,
`Their hearts pounded as if they would burst out.`,
`They tried to run, but Andrey tripped over a stone.`,
`a|Ow!`,
`Nikita didn’t run away. He went back for him, but the deer had already caught up with them.`,
`n|Crap...`,
`Nikita tried to fight it off with a stick, but the deer knocked it away and scratched Nikita’s leg so badly that a little more and the bone would have been visible.`,
`n|Aaaah! (Nikita screamed through his tears)`,
`Meanwhile, with Anya and Ivan.`,
`l|They’re most likely on the island. Let’s sail there!`,
`They heard Nikita’s scream.`,
`i|Sail there faster!!`]},
{h:`The Owl`,t:[
`Meanwhile, with Nikita and Andrey.`,
`a|This is the end. (said in a trembling voice)`,
`And then an owl flies out from behind the trees. It is no bigger than a meter at most, but its wings are huge, bigger than its body, and its feathers are sharp as knives. It strikes the deer with its wings and scratches it with its claws, but then the deer hits its wing and disappears into the forest.`,
`The owl walks up to Nikita, puts some herbs on the wound and bandages him with a piece of cloth. He passes out.`,
`And then Ivan and Anya come running.`,
`i|What is that monster behind you?`,
`a|Don’t be afraid, it protected us.`,
`l|Where is Nikita?`,
`a|He’s been wounded.`]},
{h:`Mysteries of the Island`,t:[
`It started to rain.`,
`l|What is that creature?`,
`a|Let’s go to that cave, I’ll explain everything there.`,
`l|So what is it?`,
`a|I don’t know, but it saved our lives.`,
`i|From what?`,
`a|From a big, scary beast that looked like a deer.`,
`i|We need to sail away from here, Nikita could die from his wound.`,
`a|Let’s wait until the rain stops.`,
`l|We can’t wait, let’s go quickly!!!`,
`a|Fine.`,
`l|Take Nikita and let’s go, quickly.`,
`They reached the shore.`,
`l|What? Where are our boats!!??`,
`The barking of dogs was heard.`,
`a|What is that??`,
`l|Dogs, can’t you hear?`,
`a|After the deer, I’m not happy about animals anymore.`,
`And then a pack of dogs surrounded them, but not ordinary ones: they were green, with peeling skin, their organs were visible, and they stank of rot.`,
`a|What do we do? They’ve surrounded us!`,
`And then a bat flies by, quite large itself, screeching, and the dogs get distracted by it.`,
`l|Let’s not waste time, run!!`,
`Through the fog and the dense forest, they still make it to the mysterious temple.`]},
{h:`The Dungeon`,t:[
`The doors were covered in dust and strange symbols.`,
`l|What is this?`,
`Nikita woke up.`,
`n|What?.. Where am I? (Nikita said in a weak voice)`,
`a|You’re finally awake! How do you feel?`,
`n|Fine.`,
`i|Can you walk?`,
`n|Yes. (gets to his feet)`,
`Anya wiped all the dust off with her sleeve.`,
`A strange man with a long beard was carved on the doors. Anya pressed one of the symbols, and the door began to speak to them.`,
`???: To enter the dungeon, you must solve a riddle. Are you ready?`,
`l|Give me your riddle.`,
`???: It has no past, nobody has ever seen it, but everyone counts on it. What is it?`,
`l|Easy, it’s tomorrow.`,
`The doors to the dungeon opened.`,
`l|Let’s go.`,
`The dungeon was dusty and dirty.`,
`a|Look!`,
`There was a big statue in the dungeon, also of a man, with a huge snake coiled around him. Above them was a pane of glass, very dusty and dirty.`,
`a|A snake, like in Harry Potter.`,
`l|Which one? An anaconda?`,
`a|Who cares!`,
`l|Look, the Moon has only just come out. Strange, it’s almost morning already.`,
`n|That’s the only thing bothering you?`,
`And then the ground began to shake, and stones started falling from the stone anaconda.`]},
{h:`The Anaconda`,t:[
`l|What the...?`,
`i|Run!`,
`a|Where? The entrance is blocked!`,
`l|That door over there!`,
`Anya pointed past the snake.`,
`n|Hurry, it’s going to catch us any second!`,
`Anya pulled the handle down.`,
`l|Oh no, the door is locked!`,
`And then, through the dirty glass, rays of sunlight break through, falling right on the anaconda’s tail, and it slowly turns back to stone.`,
`l|What on earth?`,
`n|It hardened because of the sun? What?`,
`a|Strange.`,
`i|Maybe all the monsters on the island have frozen?`,
`a|Look, the entrance opened!`]},
{h:`The Chests`,t:[
`Beyond the open entrance, a long corridor began.`,
`i|Someone really didn’t want us to get here. And someone really wanted us to make it.`,
`l|Let’s just keep walking and not touch anything.`,
`At the end of the corridor stood a large golden chest. It glowed and hummed softly.`,
`a|CHEST!!!`,
`Inside lay a heavy gold coin with a skull on it.`,
`a|I FOUND A PIRATE TOKEN!!!`,
`a|It’s a LEGENDARY PIRATE TOKEN! You only find these on the island!`,
`Under the coin lay a small blue bottle, and another one beside it.`,
`a|SHIELD POTION! Nikita, drink it, quickly!`,
`Nikita sniffed it suspiciously and drank it.`,
`n|Weird... My wound stopped hurting. Completely.`,
`l|How do you even know what this is?`,
`i|He just played too much.`,
`The wall opposite was covered in old letters. Anya wiped the dust off with her sleeve and read aloud.`,
`l|“The one who brings the light will open the heart of the island. But the heart of the island does not love the light.”`,
`And then the floor trembled lightly. A black haze began to creep from under the doors at the end of the corridor.`,
`a|THE STORM IS CLOSING IN! Run to the center!`,
`l|Just run!!`]},
{h:`The Storm`,t:[
`The black haze crept after them slowly but surely, and with every minute the ring around them grew tighter.`,
`a|We need a safe zone!`,
`l|There’s light over there, look!`,
`In the big round hall the ceiling was made of glass. A weak sunbeam broke through the dirt and drew a bright circle on the floor.`,
`Everyone stood inside the circle. The haze stopped, as if it had hit an invisible wall.`,
`i|It doesn’t come into the light.`,
`a|We’re INSIDE the zone. Everything by the rules!`,
`A low voice came from the haze. It was so quiet that it seemed to sound right inside everyone’s head.`,
`???: Children of the sun... You are so small. So warm.`,
`???: I am the one you call darkness. I am the one who took your friend.`,
`i|Ilya! Where is he?!`,
`???: He is in my heart. If you want him back, come and get him.`,
`The haze parted, and a heavy stone door opened in the wall. Beyond it, stairs led down.`,
`a|We’ll grab Ilya and some loot on the way.`,
`Below was a huge cave, and over the abyss hung a cage made of black fingers.`,
`Ilya was sitting in the cage.`,
`y|Guys... don’t come closer! It’s...`,
`He didn’t have time to finish.`]},
{h:`The Black Hand`,t:[
`A huge hand rose from the abyss. It was made of smoke and dark shadows, and each finger was as long as a tree.`,
`???: Welcome to the heart of the island.`,
`l|Let Ilya go!`,
`???: I am not holding him. He stayed on his own. He is afraid of the light, too.`,
`???: I need the light. All of it. When the sun goes out, the island will be mine alone.`,
`Anya looked around. On the sides of the cave stood two large stone wheels with mirrors, and above them was glass through which a ray broke in.`,
`l|Look. Mirrors. They can aim the ray right at it.`,
`There was an inscription carved on the wheels, and Nikita read it aloud.`,
`n|“Whoever turns the wheel cannot let go of it while the light burns.”`,
`i|So two people have to stand here and hold the mirrors until the sun rises?`,
`n|No. Until the light burns. And it burns as long as someone holds on.`,
`a|Then I’ll do it!`,
`l|No, Andrey. Ilya needs you. And Vanya does. You’re their friend.`,
`Nikita walked to one wheel, Anya to the other.`,
`n|I almost died once already anyway. Kind of got used to it.`,
`l|We’ll manage. I promise.`,
`a|Guys, don’t...`,
`But Anya and Nikita had already taken hold of the wheels.`,
`???: Foolish children. Do you really think the light will be enough?`,
`Anya turned the wheel, and the mirror flared up.`]},
{h:`The Light`,t:[
`The ray struck the black hand, and the cave shook with a scream.`,
`The fingers smoked, and the cage with Ilya slowly lowered onto a stone ledge.`,
`Andrey and Vanya caught Ilya and pulled him out of the cage.`,
`y|Thank you... You came.`,
`But the ray grew brighter and brighter, and the wheels under Anya’s and Nikita’s hands began to glow.`,
`n|Anya... I feel warm.`,
`l|Me too.`,
`a|What’s happening to you?! Let go of the wheels! Hurry!`,
`n|We can’t, Andrey. We knew.`,
`l|Don’t. Really, don’t.`,
`Anya looked at Vanya and Andrey and smiled.`,
`l|You’re the best friends in the world. Don’t forget us.`,
`n|And don’t be sad for too long. We’ll be watching from above.`,
`The light became so bright that everyone closed their eyes.`,
`When they opened them, there was no one at the wheels anymore. Only two warm, bright spots on the stone.`,
`y|This is... because of me.`,
`a|No, Ilya. It’s not because of you.`,
`The ray trembled and went out. Clouds gathered above, and the glass grew dark.`,
`The black hand rose even higher, and the cave filled with its laughter.`,
`???: They were brave. But now there are only three of you.`,
`Andrey wiped his face with his sleeve and looked up.`,
`a|Vanya. We need to get above the clouds.`]},
{h:`The Bus`,t:[
`a|The sun is behind the clouds. If we rise higher, we’ll bring the light ourselves.`,
`Andrey looked around the cave. Huge chunks of stone lay everywhere.`,
`a|I think... I’m going to try one thing.`,
`He took a breath and shouted, as if he did it every day.`,
`a|BUILD A WALL! A RAMP! A ROOF!`,
`The stones shivered, rose into the air and folded themselves into stairs that raced upward right through the ceiling.`,
`They climbed up: Andrey, Vanya and Ilya, whom the boys almost carried in their arms.`,
`The stairs broke through the glass, passed through the black clouds and led them out into the bright blue sky.`,
`Above the clouds hung a huge blue bus with a big balloon.`,
`a|THE BATTLE BUS!!!`,
`The bus was empty. In the driver’s seat lay an old cassette labeled “DANCES.”`,
`Vanya picked it up and turned it over in his hands.`,
`a|Play it!`,
`Vanya pushed the cassette into an old tape player, and cheerful music spread across the clouds.`,
`The bus shuddered, roared and floated down toward the island.`,
`a|I have a really good plan.`,
`i|What is it?`,
`a|We’ll get out of the bus and dance.`,
`i|WHAT?!`]},
{h:`The Dance`,t:[
`The bus hovered above the cave. Below, a huge black hand looked up at them.`,
`???: You came back. Are there really only three of you left?`,
`a|There are exactly as many of us as we need.`,
`Andrey opened the bus door and, without thinking, jumped down. A huge umbrella opened above him. Vanya shut his eyes and jumped after him.`,
`They landed right in front of the black hand. The music from the cassette thundered across the whole island.`,
`a|We didn’t come to fight. We came to dance.`,
`Andrey spread his arms wide, flapped them like crazy and started spinning in place.`,
`Vanya watched him for a second. Then he took a deep breath and started dancing next to him, even sillier.`,
`???: What are you doing? Stop it...`,
`a|You haven’t seen me do the floss yet!`,
`Andrey began swinging his arms like a flosser. The hand froze.`,
`Green dogs with peeling skin, a big deer and a huge bat came out of the tunnels.`,
`But the dogs stopped. One of them timidly twitched a paw in time with the music.`,
`The deer began swaying its antlers, and the bat started circling right under the ceiling.`,
`a|Fear can’t stand laughter!`,
`The black hand trembled. Its fingers began to crumble.`,
`???: Stop it! This is impossible! I am... I am darkness...`,
`a|And we’re just people who love to dance!`,
`The last chord rang out loudly, and the clouds over the island parted.`,
`A bright sunbeam struck the very center of the cave.`]},

/* ---------- chill music (synthesized, no files) ---------- */
var AC=null,master,wet,noiseBuf,timer=0,nextT=0,step=0,on=false;
var SPB=60/72,E=SPB/2;
var CHORDS=[{n:[293.66,349.23,440,523.25],b:73.42},{n:[196,246.94,293.66,349.23],b:98},{n:[261.63,329.63,392,493.88],b:65.41},{n:[220,261.63,329.63,392],b:55}];
var PENT=[523.25,587.33,659.25,783.99,880,1046.5];
function env(g,t,a,peak,rel,end){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+end);}
function tone(type,f,t,a,peak,end,dest){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;env(g,t,a,peak,0,end);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+end+0.05);}
function noise(t,len,type,freq,peak){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;env(g,t,0.003,peak,0,len);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*0.5);s.stop(t+len+0.05);}
function kick(t,v){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+0.16);env(g,t,0.004,v,0,0.3);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.35);}
function note(i,t){
  var bar=Math.floor(i/8)%4,pos=i%8,c=CHORDS[bar],sw=(pos%2)*SPB*0.07,tt=t+sw;
  if(pos===0){c.n.forEach(function(f,k){tone('triangle',f,tt+k*0.012,0.5,0.045,E*8,master);tone('sine',f/2,tt,0.6,0.03,E*8,master);});}
  if(pos===0||pos===4){tone('sine',c.b,tt,0.02,0.2,E*3.4,master);}
  if(pos===0)kick(tt,0.32);if(pos===4)kick(tt,0.2);if(pos===3&&Math.random()<0.4)kick(tt,0.1);
  if(pos===2||pos===6)noise(tt,0.14,'bandpass',1800,0.07);
  if(pos%2===1)noise(tt,0.04,'highpass',7500,0.025*(0.6+Math.random()*0.8));
  if((pos===0||pos===3||pos===5||pos===6||pos===7)&&Math.random()<0.5){
    var f=PENT[Math.floor(Math.random()*PENT.length)];
    tone('triangle',f,tt,0.01,0.05,0.9,master);tone('sine',f*2,tt,0.01,0.012,0.5,master);
  }
}
function sched(){while(nextT<AC.currentTime+1.2){note(step,nextT);nextT+=E;step++;}}

  if(AC)return true;

}

function roll(){
  var k=L(),r=Math.random();

    st.t++;legendNow=true;
    var sp='';for(var q=0;q<14;q++){var ang=q/14*Math.PI*2+Math.random()*0.3,d=55+Math.random()*45;sp+='<i style="--x:'+Math.round(Math.cos(ang)*d)+'px;--y:'+Math.round(Math.sin(ang)*d*0.8-20)+'px;animation-delay:'+(0.45+Math.random()*0.25).toFixed(2)+'s"></i>';}

  }

}
function openChest(){

    legendNow=false;
    var res=roll();
    render(res,k.again,false);

      m.classList.remove('legend');void m.offsetWidth;m.classList.add('legend');
      m.querySelector('#chc').classList.add('glow');
      setTimeout(function(){m.classList.remove('legend');},1400);
    }

  },520);
}
function show(){last=document.activeElement;m.hidden=false;render('',L().open,false);m.querySelector('#cho').focus();}
function close(){m.hidden=true;m.innerHTML='';busy=false;if(last&&last.focus&&document.contains(last))last.focus();}
document.addEventListener('click',function(e){
  var t=e.target;if(!t||!t.closest)return;

  if(m.hidden)return;
  if(t.closest('#cho')){openChest();return;}
  if(t.closest('#chx')||t===m)close();
});
