<title>Легенда острова</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Ruslan+Display&display=swap">
<style>
:root{
  --bg:#eef3ef; --surface:#ffffff; --text:#14262c; --muted:#4d646b;
  --sea:#1f6f78; --sun:#a8700a; --coral:#c24a44; --vio:#8a5a9c; --line:#c9d8d4;
  --hero-a:#0f2a33; --hero-b:#1f6f78; --hero-text:#f3efe2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1d22; --surface:#12292f; --text:#e9efe9; --muted:#9db5b8;
    --sea:#59b3bb; --sun:#f2b84b; --coral:#ef7f77; --vio:#c79ad8; --line:#25444b;
    --hero-a:#07151a; --hero-b:#14515a;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1d22; --surface:#12292f; --text:#e9efe9; --muted:#9db5b8;
  --sea:#59b3bb; --sun:#f2b84b; --coral:#ef7f77; --vio:#c79ad8; --line:#25444b;
  --hero-a:#07151a; --hero-b:#14515a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Alegreya",Georgia,"Times New Roman",serif;font-size:1.25rem;line-height:1.7}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hero{background:linear-gradient(170deg,var(--hero-a),var(--hero-b));color:var(--hero-text);padding:3rem 1.5rem 0;text-align:center;overflow:hidden}
.lang{display:inline-flex;gap:.3rem;margin-bottom:1.5rem;background:rgba(255,255,255,.12);padding:.25rem;border-radius:999px}
.lang button{font:inherit;font-size:1rem;border:0;background:transparent;color:var(--hero-text);padding:.3rem 1rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#f2b84b;color:#1b1500}
.hero p.sub{margin:0 0 .5rem;font-style:italic;opacity:.8}
.hero h1{font-family:"Ruslan Display","Alegreya",Georgia,serif;font-weight:400;font-size:clamp(2.8rem,10vw,6rem);line-height:1.05;margin:0 auto;max-width:12ch}
.hero .lead{max-width:34rem;margin:1.2rem auto 0;font-size:1.2rem;opacity:.9}
.hero .btn{display:inline-block;margin-top:1.6rem;padding:.7rem 1.5rem;border-radius:999px;background:#f2b84b;color:#1b1500;text-decoration:none;font-weight:500}
.hero svg{display:block;width:100%;height:90px;margin-top:2rem}
main{max-width:42rem;margin:0 auto;padding:3rem 1.5rem 2rem}
article{margin-bottom:3.5rem}
.chapter-head{border-left:4px solid var(--sun);padding-left:1rem;margin-bottom:2rem}
.chapter-head small{color:var(--muted);font-size:1rem}
.chapter-head h2{margin:.1rem 0 0;font-family:"Ruslan Display","Alegreya",Georgia,serif;font-weight:400;font-size:2.2rem;line-height:1.2}
.story p{margin:0 0 1.2rem}
.story .first::first-letter{font-family:"Ruslan Display","Alegreya",serif;float:left;font-size:4rem;line-height:.85;padding:.35rem .6rem 0 0;color:var(--sea)}
.story .line{margin:0 0 .9rem;padding-left:1rem;border-left:3px solid var(--c,var(--line))}
.line b{color:var(--c,var(--text));font-weight:500}
.sp-n{--c:var(--coral)} .sp-i{--c:var(--sun)} .sp-a{--c:var(--sea)} .sp-l{--c:var(--vio)} .sp-g{--c:var(--muted)} .sp-y{--c:#d08a3c}
h3{font-size:1.5rem;margin:3rem 0 1rem}
.cast{list-style:none;padding:0;margin:0;display:grid;gap:.9rem}
.cast li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;display:grid;grid-template-columns:3.2rem 1fr;gap:.2rem 1rem;align-items:center}
.cast .mark{grid-row:span 2;width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:500;color:#fff}
.cast b{font-size:1.3rem}
.cast span{color:var(--muted);line-height:1.4}
.m-n{background:#c24a44}.m-i{background:#7a6a2a}.m-a{background:#1f6f78}.m-l{background:#8a5a9c}.m-g{background:#5d6d72}.m-y{background:#a0612a}
.next{margin-top:3rem;border:2px dashed var(--line);border-radius:14px;padding:1.4rem;text-align:center;color:var(--muted)}
.next h3{margin:0 0 .4rem;color:var(--text)}
footer{text-align:center;color:var(--muted);padding:2rem 1.5rem 3rem;font-size:1rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.stage{max-width:34rem;margin:0 auto;padding:2rem 1rem 3rem;scroll-margin-top:1rem}
.book{perspective:1400px}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;width:100%;aspect-ratio:3/4;max-height:34rem;border:0;border-radius:6px 16px 16px 6px;cursor:pointer;color:#f2d98b;font:inherit;text-align:center;padding:2rem;background:linear-gradient(135deg,#14515a,#0c2a31);box-shadow:inset 10px 0 0 rgba(0,0,0,.35),inset 0 0 0 10px #0c2a31,inset 0 0 0 12px #c9a24a,0 18px 40px rgba(0,0,0,.35);transform-origin:left center;transition:transform .7s ease,opacity .7s ease}
.cover[hidden],.sheet[hidden]{display:none}
.cover.opening{transform:rotateY(-110deg);opacity:.2}
.cv-t{font-family:"Ruslan Display","Alegreya",Georgia,serif;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1.1}
.cv-i{font-size:3.5rem;transition:transform .3s}
.cover:hover .cv-i{transform:scale(1.12)}
.cv-s{font-size:1rem;opacity:.85;font-style:italic}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px 16px 16px 6px;padding:2rem 1.6rem 1.6rem 2.2rem;min-height:26rem;font-size:1.15rem;box-shadow:inset 8px 0 14px -8px rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.18);transition:opacity .25s,transform .25s;outline:none}
.paper.turn{opacity:0;transform:translateX(14px) rotateY(-8deg)}
.paper .chapter-head h2{font-size:1.8rem}
.paper h3{margin-top:0}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:1rem}
.ctrl span{color:var(--muted);font-size:1rem}
.ctrl button,.closeb{font:inherit;font-size:1rem;padding:.55rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.ctrl button:disabled{opacity:.4;cursor:default}
.closeb{display:block;margin:1rem auto 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cover,.paper{transition:none}}

:root,:root:not([data-theme="light"]),:root[data-theme="dark"],:root[data-theme="light"]{
 color-scheme:dark;--bg:#0a100c;--surface:#121b15;--text:#e9e3d6;--muted:#a3b0a4;--sea:#7fbf8a;--sun:#e9e2b8;--coral:#ef6a5e;--vio:#c79ad8;--line:#263629;--hero-a:#1b0508;--hero-b:#a3231f;--hero-text:#f8eedb}
.hero{background:
 radial-gradient(1.5px 1.5px at 8% 12%,rgba(255,255,255,.85),transparent),
 radial-gradient(1.5px 1.5px at 22% 30%,rgba(255,255,255,.6),transparent),
 radial-gradient(2px 2px at 35% 8%,rgba(255,255,255,.8),transparent),
 radial-gradient(1.5px 1.5px at 62% 20%,rgba(255,255,255,.7),transparent),
 radial-gradient(1.5px 1.5px at 78% 9%,rgba(255,255,255,.85),transparent),
 radial-gradient(2px 2px at 90% 28%,rgba(255,255,255,.6),transparent),
 radial-gradient(1.5px 1.5px at 14% 52%,rgba(255,255,255,.5),transparent),
 radial-gradient(1.5px 1.5px at 94% 55%,rgba(255,255,255,.5),transparent),
 linear-gradient(180deg,#14040a 0%,#5a0d17 35%,#a8281f 70%,#d9532e 100%)}
.hero>*{position:relative;z-index:1}
.hero h1{text-shadow:0 2px 26px rgba(0,0,0,.6)}
.hero svg{height:clamp(300px,52vw,460px);margin-top:1rem}
.lang button[aria-pressed="true"],.hero .btn{background:#e9e2b8;color:#1a0a0a}
.moon{display:block;width:clamp(4.5rem,18vw,6.5rem);aspect-ratio:1;margin:0 auto 1.2rem;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffdf0,#efe8c3 55%,#c9c196);box-shadow:0 0 40px 12px rgba(255,236,190,.45),0 0 110px 40px rgba(255,120,80,.25)}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 38%,rgba(120,110,80,.35) 0 9%,transparent 10%),radial-gradient(circle at 38% 66%,rgba(120,110,80,.3) 0 13%,transparent 14%),radial-gradient(circle at 70% 70%,rgba(120,110,80,.25) 0 6%,transparent 7%)}
.chapter-head{border-left-color:var(--coral)}
.story .first::first-letter{color:var(--coral)}
.m-a{background:#3f7a4d}
.cover{color:#efe8c3;background:linear-gradient(180deg,#6b1218 0%,#2c0a0e 50%,#0a120d 100%);box-shadow:inset 10px 0 0 rgba(0,0,0,.45),inset 0 0 0 10px #12090b,inset 0 0 0 12px #c9c4a0,0 18px 40px rgba(0,0,0,.6)}
.paper{background:linear-gradient(180deg,#16211a,#101812);border-color:#2c3d30}
.paper{position:relative}
.bm{position:absolute;top:-6px;right:1.4rem;width:2.1rem;height:4.4rem;border:0;padding:0;cursor:pointer;background:linear-gradient(180deg,#a3231f,#ef6a5e);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 4px 10px rgba(0,0,0,.4);transition:height .2s}
.bm:hover,.bm:focus-visible{height:5rem}
.egg{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1.5rem;text-align:center;background:radial-gradient(circle at 50% 40%,#1c2620,#050806 70%);color:#e9e3d6}
.egg[hidden]{display:none}
.egg svg{width:min(15rem,60vw);height:auto}
.egg p{margin:0;font-family:"Ruslan Display","Alegreya",Georgia,serif;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.2;max-width:18ch}
.egg button{font:inherit;font-size:1.1rem;padding:.7rem 1.6rem;border-radius:999px;border:0;background:#e9e2b8;color:#1a0a0a;cursor:pointer}
.egg .tip{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.egg.flash::after{content:"";position:absolute;inset:0;background:#fff;pointer-events:none;animation:flash 1.4s ease-out forwards}
@keyframes flash{0%,25%{opacity:1}100%{opacity:0}}

.onl{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:.5rem;font:inherit;font-size:1rem;padding:.5rem 1rem;border-radius:999px;border:1px solid #2c3d30;background:rgba(18,27,21,.92);color:#e9e3d6;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.onl i{width:.65rem;height:.65rem;border-radius:50%;background:#4cd964;box-shadow:0 0 0 0 rgba(76,217,100,.6);animation:pulse 2s infinite}
.onl.off i{background:#a3b0a4;animation:none}
.onl.busy{opacity:.7}
@keyframes pulse{70%{box-shadow:0 0 0 .5rem rgba(76,217,100,0)}100%{box-shadow:0 0 0 0 rgba(76,217,100,0)}}
@media (prefers-reduced-motion:reduce){.onl i{animation:none}}
@media (prefers-reduced-motion:reduce){.egg .tip{animation:none}.egg.flash::after{animation-duration:.01s}}
.acts{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:1.6rem}
.acts .btn{margin-top:0}
.hero .btn2{font:inherit;font-weight:500;border:2px solid #e9e2b8;background:transparent;color:#f8eedb;cursor:pointer;padding:.6rem 1.4rem}
.bio{position:fixed;inset:0;z-index:60;background:rgba(5,8,6,.9);display:flex;justify-content:center;overflow-y:auto;padding:1.2rem 1rem calc(1.2rem + env(safe-area-inset-bottom,0px))}
.bio[hidden]{display:none}
.bio-in{width:min(100%,38rem);height:fit-content;margin:auto 0;background:linear-gradient(180deg,#16211a,#101812);border:1px solid #2c3d30;border-radius:16px;padding:1.6rem 1.4rem;color:#e9e3d6}
.bio-in h2{font-family:"Ruslan Display","Alegreya",Georgia,serif;font-weight:400;font-size:2rem;line-height:1.2;margin:0 0 1rem}
.bio-c{border-top:1px solid #263629;padding:1rem 0}
.bio-c:first-of-type{border-top:0}
.bio-h{display:flex;align-items:center;gap:.8rem}
.bio-h b{font-size:1.35rem}
.bio-t{color:#a3b0a4;font-size:1rem;line-height:1.3}
.bio .mark{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;font-weight:500;color:#fff}
.bio dl{margin:.7rem 0 0;display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;font-size:1.1rem}
.bio dt{color:#a3b0a4}
.bio dd{margin:0}
.bio-x{display:block;margin:1.2rem auto 0;font:inherit;font-size:1.05rem;padding:.6rem 1.6rem;border-radius:999px;border:0;background:#e9e2b8;color:#1a0a0a;cursor:pointer}
.story .chapter-head:not(:first-child){margin-top:2.2rem}
.petal{position:absolute;left:1rem;bottom:.9rem;width:2.3rem;height:2.3rem;border:0;padding:0;cursor:pointer;background:radial-gradient(circle at 30% 30%,#ffc2d1,#f08aa8 60%,#d65a82);border-radius:0 100% 0 100%;transform:rotate(-18deg);box-shadow:0 2px 8px rgba(0,0,0,.4);animation:petalw 3s ease-in-out infinite}
.petal:focus-visible{outline:3px solid #e9e2b8;outline-offset:3px}
@keyframes petalw{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-8deg) translateY(-2px)}}
.dz-space{height:5rem}
.daisy{position:absolute;right:.8rem;bottom:.6rem;width:5.2rem;height:6.2rem;opacity:0;transform:translateY(45%) scale(.75);transform-origin:bottom center;pointer-events:none;transition:opacity .35s,transform .45s}
.daisy.in{opacity:1;transform:none}
.daisy.hop{animation:dzhop .6s ease}
.daisy svg{display:block;width:100%;height:100%}
.daisy .say{position:absolute;right:72%;bottom:92%;white-space:normal;width:max-content;max-width:11rem;text-align:center;background:#e9e2b8;color:#1a0a0a;padding:.3rem .8rem;border-radius:12px;font-size:.95rem;line-height:1.35;box-shadow:0 2px 8px rgba(0,0,0,.35)}
@keyframes dzhop{0%,100%{transform:none}35%{transform:translateY(-22%) rotate(-5deg)}70%{transform:translateY(0) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.petal,.daisy{animation:none;transition:none}}
.egg.aim{cursor:pointer}
.egg .redblink{color:#ff2a2a;text-shadow:0 0 16px rgba(255,0,0,.55);animation:redblink .8s steps(1,end) infinite}
@keyframes redblink{0%{color:#ff2a2a;opacity:1}50%{color:#5a0a0a;opacity:.5}}
.egg.shot svg{animation:eshake .4s ease-out}
@keyframes eshake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.egg .mf{animation:muz 1s ease-out forwards;transform-origin:100px 165px}
@keyframes muz{0%{opacity:1;transform:scale(1.15)}35%{opacity:1;transform:scale(1)}100%{opacity:.12;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.egg .redblink,.egg.shot svg,.egg .mf{animation:none}}
.moonw{position:relative;width:clamp(4.5rem,18vw,6.5rem);margin:0 auto 1.2rem}
.moonw .moon{margin:0;width:100%}
.hero .vd{position:absolute;left:calc(50% - 127px);top:calc(50% + 14px);width:36px;height:36px;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;cursor:pointer;z-index:2}
.vd::before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.8);animation:vdt 2.6s ease-in-out infinite}
@keyframes vdt{50%{opacity:.45}}
.hero .vd-t{position:absolute;left:calc(50% - 127px);top:calc(50% + 14px);transform:translate(-26px,14px);white-space:nowrap;color:#fff;font-style:italic;font-size:1.05rem;text-shadow:0 1px 8px rgba(0,0,0,.75);opacity:0;pointer-events:none;transition:opacity .4s;z-index:2}
.hero .vd-t.on{opacity:1}
@media (prefers-reduced-motion:reduce){.vd::before{animation:none}.hero .vd-t{transition:none}}
</style>

<script>
(function(){
var T={
ru:{
title:`Легенда острова`,sub:`Книга, которую пишем вместе с друзьями`,
lead:`Они приехали в село не так давно. Никто ещё не знал, чем всё это закончится.`,
start:`Начать читать`,sec:`Раздел`,who:`Кто есть кто`,next:`Раздел 7 скоро`,
nextp:`Продолжение пишут друзья. Напишите свой раздел, и он появится здесь.`,foot:`Легенда острова. Пишем вместе.`,
names:{n:`Никита`,i:`Иван`,a:`Андрей`,l:`Аня`,g:`Бабушка Люся`,y:`Илья`},
descs:{n:`Бесстрашный. Первым идёт туда, куда другие боятся.`,i:`По кличке Олень 🦌. Трусоват, зато у него есть своё прозвище.`,a:`Смешной и немного нарцисс.`,l:`Сестра братьев. Добрая и умная.`,g:`Бабушка. Ждёт внуков в селе.`,y:`Приёмный сын бабушки Люси. Живёт с ней в селе.`},
secs:[
{h:`Как всё началось`,t:[
`Это было не так давно. В одно село приехали три брата.`,
`Первого брата звали Никита, второго — Иван, а третьего — Андрей. С ними приехала и их сестра Аня. А в селе их ждали бабушка Люся и её приёмный сын Илья.`,
`Все четверо были совсем разные. Аня была доброй и умной. Андрей был смешным и немного нарциссом. Никита был бесстрашным. А Иван был трусоват, и кличка у него была Олень 🦌.`,
`А теперь приятного чтения.`,
`n|Фух, наконец-то приехали.`,
`i|Да, наконец-то... (сказал Иван своим писклявым голосом)`,
`l|Чего ты так боишься этого села? Почему?`,
`a|Он просто в интернете начитался, что озеро в этом селе проклято.`,
`n|Ха-ха-ха-ха, Олень всему верит!`,
`i|Я не Олень! Хватит меня так называть.`,
`n|А то что? Ударишь меня?`,
`l|А ну, угомонились! Пойдёмте уже к бабушке.`]},
{h:`Дорога к бабушке`,t:[
`a|Боже, в этом селе даже нормального компа нет.`,
`n|Не бойся, Роблокс потянет.`,
`a|Я один раз в него играл, и то сразу вышел.`,
`l|Ну, мы пришли. Заходите уже.`,
`g|Привет, мои любимые внуки!`,
`g|Проходите за стол.`,
`a|А где дед?`,
`g|Он на рыбалку уехал, но оставил вам в подарок две лодки.`,
`n|А нам можно будет поплавать на них?`,
`g|Да, но пока нужно поесть. Пойдёмте за стол.`,
`На столе было много вкусной еды.`,
`i|Спасибо, бабушка, мы поели.`,
`a|Спасибо.`,
`n|Спасибо.`,
`l|Спасибо.`,
`Вдруг кто-то крикнул: «Пацаны!» — и влетел во двор. Это был Илья, мальчик, которого приютила бабушка.`,
`y|Я вас так долго ждал!`,
`n|Братан, я так ждал этой встречи!`,
`Никита и Илья были лучшими друзьями.`,
`a|Ну что, го на речку?`,
`i|Может, не надо? Давайте лучше здесь посидим.`,
`n|Да не парься, Олень, всё будет ок.`,
`l|Реально, не бойся, всё будет хорошо.`,
`i|Ну ладно, пойдёмте... (неуверенно сказал Иван)`]},
{h:`Дорога к озеру через лес`,t:[
`l|В лесу так прикольно!`,
`y|Смотрите, рыжие зайцы!`,
`a|Это же Дейзи из «Дума»!`,
`n|Я думал, озеро дальше, а мы уже пришли.`,
`i|Почему тут такой густой туман?`,
`n|Бу! (подошёл сзади и напугал Ивана)`,
`i|Аааа! (закричал Иван)`,
`l|Вы же братья, должны дружить.`,
`n|С этим лохом так и надо.`,
`y|Всё, давайте уже плыть.`]},
{h:`Похищение`,t:[
`i|На воде так страшно.`,
`a|Не бойся, мы с тобой рядом. Но запомни: спасать тебя я не буду.`,
`l|Ха-ха, как смешно. (сказала с сарказмом Аня)`,
`Чёрная тень проплыла под водой.`,
`i|Что это там под водой? Не трогайте воду!`,
`y|Да не бойся! Ты вот, смотри. (опустил руку в воду) Всё окей.`,
`И тут чёрная лапа с когтями схватила Илью за руку.`,
`n|Какого хера?!`,
`Никита ударил по руке, но чёрная рука поцарапала его и утащила Илью.`,
`n|Бл...`,
`l|Никита!!!`,
`a|Что нам делать?!`,
`i|Нужно плыть на берег!!!`]},
{h:`Остров и разделение команды`,t:[
`l|Иван прав, нам нужно плыть на берег!`,
`n|Нет, он украл моего друга.`,
`l|Как хочешь, мы с Ваней будем плыть к берегу.`,
`n|Ну и плывите. Андрей, ты со мной?`,
`a|Конечно.`,
`l|Наконец-то, вот и берег! Пошли к взрослым.`,
`i|Нет. (неуверенно сказал Иван) Я такой трус... (посмотрел на свои дрожащие руки) Они бы нам помогли. Нам нужно плыть к ним!`,
`l|Ладно, я с тобой. Ведь без меня вы не выживете.`,
`Тем временем у Никиты и Андрея.`,
`a|Куда будем плыть?`,
`n|На остров.`,
`a|Почему туда?`,
`n|Я чувствую, он там.`,
`a|Ладно, го.`,
`Они приплыли на остров.`,
`a|Фу, тут так воняет гнилью, как будто тут кто-то умер.`,
`n|Ага.`,
`Что-то пробежало за деревом с хрустом веток.`,
`n|Что это за хрень там?`,
`Из деревьев выбежало существо, похожее на оленя, только четырёх метров высотой, с облезлой кожей и красными глазами. Даже кости видно, а когти были сантиметров сорок.`,
`n|Что за хрень? Что делать?`,
`a|Бл... Бежать!`,
`У парней так колотилось сердце, будто сейчас выскочит.`,
`Они пытались убежать, но Андрей споткнулся о камень.`,
`a|Ай!`,
`Никита не убежал, а вернулся за ним, но их уже догнал олень.`,
`n|Су...`,
`Никита пытался отбиться палкой, но олень отбил её и поцарапал Никиту за ногу, да так, что ещё немного, и была бы видна кость.`,
`n|Аааа! (через слёзы закричал Никита)`,
`Тем временем у Ани и Ивана.`,
`l|Они скорее всего на острове. Плывём туда!`,
`Они услышали крик Никиты.`,
`i|Плывём туда быстрее!!`]},
{h:`Сова`,t:[
`Тем временем у Никиты и Андрея.`,
`a|Это конец. (сказал дрожащим голосом)`,
`И тут из-за деревьев вылетает сова. Сама не больше метра, максимум, а крылья такие большие, больше чем туловище, и перья острые как ножи. Она бьёт оленя крыльями, царапает когтями, но тут олень бьёт её по крылу и скрывается в лесу.`,
`Сова подходит к Никите, кладёт какие-то травы в рану и куском ткани перевязывает его. Он отключается.`,
`И тут прибегают Иван с Аней.`,
`i|Что это за монстр позади тебя?`,
`a|Не бойся, оно защитило нас.`,
`l|Где Никита?`,
`a|Его ранили.`]}]},
uk:{
title:`Легенда острова`,sub:`Книга, яку пишемо разом з друзями`,
lead:`Вони приїхали в село не так давно. Ніхто ще не знав, чим усе це закінчиться.`,
start:`Почати читати`,sec:`Розділ`,who:`Хто є хто`,next:`Розділ 7 скоро`,
nextp:`Продовження пишуть друзі. Напишіть свій розділ, і він з’явиться тут.`,foot:`Легенда острова. Пишемо разом.`,
names:{n:`Микита`,i:`Іван`,a:`Андрій`,l:`Аня`,g:`Бабуся Люся`,y:`Ілля`},
descs:{n:`Безстрашний. Першим іде туди, куди інші бояться.`,i:`На прізвисько Олень 🦌. Полохливий, зате має своє прізвисько.`,a:`Смішний і трохи нарцис.`,l:`Сестра братів. Добра й розумна.`,g:`Бабуся. Чекає на онуків у селі.`,y:`Прийомний син бабусі Люсі. Живе з нею в селі.`},
secs:[
{h:`Як усе почалося`,t:[
`Це було не так давно. В одне село приїхали три брати.`,
`Першого брата звали Микита, другого — Іван, а третього — Андрій. З ними приїхала й їхня сестра Аня. А в селі на них чекали бабуся Люся та її прийомний син Ілля.`,
`Усі четверо були зовсім різні. Аня була доброю й розумною. Андрій був смішним і трохи нарцисом. Микита був безстрашним. А Іван був полохливий, і прізвисько в нього було Олень 🦌.`,
`А тепер приємного читання.`,
`n|Фух, нарешті приїхали.`,
`i|Так, нарешті... (сказав Іван своїм писклявим голосом)`,
`l|Чого ти так боїшся цього села? Чому?`,
`a|Він просто в інтернеті начитався, що озеро в цьому селі прокляте.`,
`n|Ха-ха-ха-ха, Олень усьому вірить!`,
`i|Я не Олень! Годі мене так називати.`,
`n|А то що? Вдариш мене?`,
`l|А ну, вгамувалися! Ходімо вже до бабусі.`]},
{h:`Дорога до бабусі`,t:[
`a|Боже, у цьому селі навіть нормального компа нема.`,
`n|Не бійся, Роблокс потягне.`,
`a|Я один раз у нього грав, і то відразу вийшов.`,
`l|Ну, ми прийшли. Заходьте вже.`,
`g|Привіт, мої любі внуки!`,
`g|Проходьте до столу.`,
`a|А де дід?`,
`g|Він поїхав на рибалку, але залишив вам у подарунок два човни.`,
`n|А нам можна буде поплавати на них?`,
`g|Так, але спочатку треба поїсти. Ходімо до столу.`,
`На столі було багато смачної їжі.`,
`i|Дякую, бабусю, ми поїли.`,
`a|Дякую.`,
`n|Дякую.`,
`l|Дякую.`,
`Раптом хтось крикнув: «Пацани!» — і влетів у двір. Це був Ілля, хлопчик, якого прихистила бабуся.`,
`y|Я вас так довго чекав!`,
`n|Братан, я так чекав цієї зустрічі!`,
`Микита й Ілля були найкращими друзями.`,
`a|Ну що, го на річку?`,
`i|Може, не треба? Давайте краще тут посидимо.`,
`n|Та не парся, Олень, усе буде ок.`,
`l|Реально, не бійся, усе буде добре.`,
`i|Ну гаразд, ходімо... (невпевнено сказав Іван)`]},
{h:`Дорога до озера через ліс`,t:[
`l|У лісі так прикольно!`,
`y|Дивіться, руді зайці!`,
`a|Це ж Дейзі з «Дума»!`,
`n|Я думав, озеро далі, а ми вже прийшли.`,
`i|Чому тут такий густий туман?`,
`n|Бу! (підійшов ззаду й налякав Івана)`,
`i|Аааа! (закричав Іван)`,
`l|Ви ж брати, маєте дружити.`,
`n|З цим лохом так і треба.`,
`y|Усе, давайте вже пливти.`]},
{h:`Викрадення`,t:[
`i|На воді так страшно.`,
`a|Не бійся, ми з тобою поруч. Але запам’ятай: рятувати тебе я не буду.`,
`l|Ха-ха, як смішно. (сказала з сарказмом Аня)`,
`Чорна тінь проплила під водою.`,
`i|Що це там під водою? Не чіпайте воду!`,
`y|Та не бійся! Ти ось дивись. (опустив руку у воду) Усе окей.`,
`І тут чорна лапа з кігтями схопила Іллю за руку.`,
`n|Якого біса?!`,
`Микита вдарив по руці, але чорна рука подряпала його й потягла Іллю.`,
`n|Блін...`,
`l|Микита!!!`,
`a|Що нам робити?!`,
`i|Треба пливти на берег!!!`]},
{h:`Острів і розділення команди`,t:[
`l|Іван має рацію, нам треба пливти до берега!`,
`n|Ні, він украв мого друга.`,
`l|Як хочеш, ми з Ванею попливемо до берега.`,
`n|Ну й пливіть. Андрію, ти зі мною?`,
`a|Звісно.`,
`l|Нарешті, ось і берег! Ходімо до дорослих.`,
`i|Ні. (невпевнено сказав Іван) Я такий боягуз... (подивився на свої тремтячі руки) Вони б нам допомогли. Нам треба пливти до них!`,
`l|Гаразд, я з тобою. Адже без мене ви не виживете.`,
`Тим часом у Микити й Андрія.`,
`a|Куди пливтимемо?`,
`n|На острів.`,
`a|Чому туди?`,
`n|Я відчуваю, він там.`,
`a|Гаразд, го.`,
`Вони припливли на острів.`,
`a|Фу, тут так тхне гниллям, ніби тут хтось помер.`,
`n|Ага.`,
`Щось пробігло за деревом із хрускотом гілок.`,
`n|Що це за дичина там?`,
`З-за дерев вибігла істота, схожа на оленя, тільки чотири метри заввишки, з облізлою шкірою та червоними очима. Навіть кістки видно, а кігті були сантиметрів сорок.`,
`n|Що за дичина? Що робити?`,
`a|Блін... Тікати!`,
`У хлопців так калатало серце, ніби зараз вискочить.`,
`Вони намагалися втекти, але Андрій спіткнувся об камінь.`,
`a|Ай!`,
`Микита не втік, а повернувся по нього, але їх уже наздогнав олень.`,
`n|Зараза...`,
`Микита намагався відбитися палицею, але олень відбив її й подряпав Микиту по нозі, та так, що ще трохи — і було б видно кістку.`,
`n|Аааа! (крізь сльози закричав Микита)`,
`Тим часом в Ані та Івана.`,
`l|Вони, скоріше за все, на острові. Пливемо туди!`,
`Вони почули крик Микити.`,
`i|Пливемо туди швидше!!`]},
{h:`Сова`,t:[
`Тим часом у Микити й Андрія.`,
`a|Це кінець. (сказав тремтячим голосом)`,
`І тут з-за дерев вилітає сова. Сама не більша за метр, максимум, а крила такі великі, більші за тулуб, і пір’їни гострі як ножі. Вона б’є оленя крилами, дряпає кігтями, але тут олень б’є її по крилу й зникає в лісі.`,
`Сова підходить до Микити, кладе якісь трави в рану й шматком тканини перев’язує його. Він втрачає свідомість.`,
`І тут прибігають Іван з Анею.`,
`i|Що це за монстр позаду тебе?`,
`a|Не бійся, воно захистило нас.`,
`l|Де Микита?`,
`a|Його поранили.`]}]},
en:{
title:`Legend of the Island`,sub:`A book we are writing together with friends`,
lead:`They arrived in the village not so long ago. No one yet knew how it would all end.`,
start:`Start reading`,sec:`Section`,who:`Who is who`,next:`Section 7 coming soon`,
nextp:`The friends are writing the continuation. Write your own section and it will appear here.`,foot:`Legend of the Island. Written together.`,
names:{n:`Nikita`,i:`Ivan`,a:`Andrey`,l:`Anya`,g:`Grandma Lyusya`,y:`Ilya`},
descs:{n:`Fearless. Goes first where others are afraid to go.`,i:`Nicknamed the Deer 🦌. Timid, but he has a nickname of his own.`,a:`Funny and a bit of a narcissist.`,l:`The brothers’ sister. Kind and smart.`,g:`Grandma. Waits for her grandchildren in the village.`,y:`Grandma Lyusya’s adopted son. Lives with her in the village.`},
secs:[
{h:`How It All Began`,t:[
`It was not so long ago. Three brothers came to a village.`,
`The first brother was called Nikita, the second Ivan, and the third Andrey. Their sister Anya came with them. In the village, Grandma Lyusya and her adopted son Ilya were waiting for them.`,
`All four were very different. Anya was kind and smart. Andrey was funny and a bit of a narcissist. Nikita was fearless. And Ivan was timid, and his nickname was the Deer 🦌.`,
`And now, enjoy the read.`,
`n|Phew, we’ve finally arrived.`,
`i|Yeah, finally... (said Ivan in his squeaky voice)`,
`l|Why are you so afraid of this village? What’s wrong?`,
`a|He just read online that the lake in this village is cursed.`,
`n|Ha-ha-ha-ha, the Deer believes everything!`,
`i|I’m not a Deer! Stop calling me that.`,
`n|Or what? You’ll hit me?`,
`l|Okay, calm down, all of you! Let’s go to Grandma’s already.`]},
{h:`The Road to Grandma’s`,t:[
`a|Oh my God, this village doesn’t even have a decent computer.`,
`n|Don’t worry, Roblox will run fine.`,
`a|I played it once, and I quit right away.`,
`l|Well, we’re here. Come on in.`,
`g|Hello, my dear grandchildren!`,
`g|Come to the table.`,
`a|Where’s Grandpa?`,
`g|He went fishing, but he left you two boats as a present.`,
`n|Can we go sailing on them?`,
`g|Yes, but first you need to eat. Come to the table.`,
`There was a lot of tasty food on the table.`,
`i|Thank you, Grandma, we’ve eaten.`,
`a|Thanks.`,
`n|Thanks.`,
`l|Thanks.`,
`Suddenly someone shouted, “Guys!” and ran into the yard. It was Ilya, a boy whom Grandma had taken in.`,
`y|I’ve been waiting for you for so long!`,
`n|Bro, I’ve been looking forward to this meeting so much!`,
`Nikita and Ilya were best friends.`,
`a|So, are we going to the river?`,
`i|Maybe we shouldn’t? Let’s stay here instead.`,
`n|Don’t worry, Deer, everything will be fine.`,
`l|Seriously, don’t be afraid, everything will be fine.`,
`i|Okay, let’s go... (said Ivan uncertainly)`]},
{h:`The Road to the Lake Through the Forest`,t:[
`l|The forest is so cool!`,
`y|Look, ginger hares!`,
`a|That’s Daisy from Doom!`,
`n|I thought the lake was farther, but we’ve already arrived.`,
`i|Why is the fog so thick here?`,
`n|Boo! (came up from behind and scared Ivan)`,
`i|Aaaah! (Ivan screamed)`,
`l|You’re brothers, you should be friends.`,
`n|This loser deserves it.`,
`y|Okay, let’s sail already.`]},
{h:`The Abduction`,t:[
`i|It’s so scary on the water.`,
`a|Don’t be afraid, we’re right beside you. But remember: I won’t save you.`,
`l|Ha-ha, so funny. (said Anya sarcastically)`,
`A black shadow swam past under the water.`,
`i|What’s that under the water? Don’t touch the water!`,
`y|Don’t be afraid! Look, watch. (put his hand in the water) See, it’s okay.`,
`And then a black paw with claws grabbed Ilya by the hand.`,
`n|What the hell?!`,
`Nikita hit the arm, but the black hand scratched him and dragged Ilya away.`,
`n|Damn...`,
`l|Nikita!!!`,
`a|What do we do?!`,
`i|We need to head for the shore!!!`]},
{h:`The Island and the Team Splits Up`,t:[
`l|Ivan is right, we need to head for the shore!`,
`n|No, it stole my friend.`,
`l|Suit yourself, Ivan and I will head for the shore.`,
`n|Fine, go. Andrey, are you with me?`,
`a|Of course.`,
`l|Finally, there’s the shore! Let’s go to the adults.`,
`i|No. (said Ivan uncertainly) I’m such a coward... (looked at his trembling hands) They would have helped us. We need to go to them!`,
`l|Fine, I’m with you. You won’t survive without me anyway.`,
`Meanwhile, with Nikita and Andrey.`,
`a|Where are we sailing?`,
`n|To the island.`,
`a|Why there?`,
`n|I can feel he’s there.`,
`a|Okay, let’s go.`,
`They reached the island.`,
`a|Ugh, it stinks of rot here, as if someone died.`,
`n|Yeah.`,
`Something ran behind a tree with a crack of branches.`,
`n|What the heck is that?`,
`A creature that looked like a deer came running out of the trees, but four meters tall, with mangy skin and red eyes. You could even see its bones, and its claws were about forty centimeters long.`,
`n|What the heck is that thing? What do we do?`,
`a|Damn... Run!`,
`Their hearts pounded as if they would burst out.`,
`They tried to run, but Andrey tripped over a stone.`,
`a|Ow!`,
`Nikita didn’t run away. He went back for him, but the deer had already caught up with them.`,
`n|Crap...`,
`Nikita tried to fight it off with a stick, but the deer knocked it away and scratched Nikita’s leg so badly that a little more and the bone would have been visible.`,
`n|Aaaah! (Nikita screamed through his tears)`,
`Meanwhile, with Anya and Ivan.`,
`l|They’re most likely on the island. Let’s sail there!`,
`They heard Nikita’s scream.`,
`i|Sail there faster!!`]},
{h:`The Owl`,t:[
`Meanwhile, with Nikita and Andrey.`,
`a|This is the end. (said in a trembling voice)`,
`And then an owl flies out from behind the trees. It is no bigger than a meter at most, but its wings are huge, bigger than its body, and its feathers are sharp as knives. It strikes the deer with its wings and scratches it with its claws, but then the deer hits its wing and disappears into the forest.`,
`The owl walks up to Nikita, puts some herbs on the wound and bandages him with a piece of cloth. He passes out.`,
`And then Ivan and Anya come running.`,
`i|What is that monster behind you?`,
`a|Don’t be afraid, it protected us.`,
`l|Where is Nikita?`,
`a|He’s been wounded.`]}]}
};

function isHead(x){return x.indexOf('class="chapter-head"')>-1;}
function items(t){
  var L=[];
  t.secs.forEach(function(s,i){
    L.push('<div class="chapter-head"><small>'+t.sec+' '+(i+1)+'</small><h2>'+s.h+'</h2></div>');
    s.t.forEach(function(x,j){
      if(x.charAt(1)==='|'){var c=x.charAt(0);L.push('<p class="line sp-'+c+'"><b>'+t.names[c]+':</b> '+x.slice(2)+'</p>');}
      else{L.push('<p'+(i===0&&j===0?' class="first"':'')+'>'+x+'</p>');}
    });
  });
  return L;
}
function paginate(L){
  var W=document.querySelector('.book').offsetWidth||360;
  var vh=Math.min(window.innerHeight||800,(window.screen&&screen.height)||800);
  var budget=Math.max(430,Math.min(vh*0.62,620));
  var m=document.createElement('div');
  m.className='paper';m.setAttribute('aria-hidden','true');
  m.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden;min-height:0;width:'+W+'px';
  document.body.appendChild(m);
  var P=[],page=[];
  function html(a){return '<div class="story">'+a.join('')+'</div>';}
  L.forEach(function(x){
    page.push(x);
    m.innerHTML=html(page);
    if(m.offsetHeight>budget&&page.length>1){
      page.pop();
      var carry=[];
      if(page.length>1&&isHead(page[page.length-1]))carry.push(page.pop());
      P.push(html(page));
      page=carry.concat([x]);
    }
  });
  if(page.length)P.push(html(page));
  document.body.removeChild(m);
  return P;
}

function show(i,anim){

    cur=i;p.innerHTML=pages[i];

}

function openEgg(){
  var e=$('egg'),u=U[lang];tries++;

  if(tries===1){
    e.innerHTML=GHOST(false)+'<p class="redblink">'+u.egg+'</p>';
    e.classList.add('aim');
    e.tabIndex=0;
  }else{
    e.innerHTML=GHOST(true)+'<button type="button" id="eggb">'+u.go+'</button>';
    e.classList.add('flash','shot');
  }

function closeEgg(){$('egg').hidden=true;$('egg').classList.remove('flash','aim','shot');var b=$('paper').querySelector('.bm');(b||$('paper')).focus();}

function closeBook(){cur=-1;$('sheet').hidden=true;$('cover').hidden=false;$('cover').focus();}
function setLang(l){
  lang=l;var t=T[l],u=U[l];
  document.documentElement.lang=l;document.title=t.title;
  document.querySelectorAll('[data-k]').forEach(function(e){e.textContent=t[e.getAttribute('data-k')];});
  pages=build(t);

  drawOnline();

  var u=U[lang];

}
